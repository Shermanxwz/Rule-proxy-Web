# Safe starter config. Replace the documentation-only node values with your
# own subscription nodes before using it. This file contains no real credentials.
# Imported rule conditions and order are retained for the managed app. Every
# forwarding action (including DIRECT and PASS) uses the selected proxy;
# REJECT/REJECT-DROP remain blocked. Process/UID rules are unsupported because
# the local relay cannot identify the original application process.
proxies:
  - name: Example-VLESS
    type: vless
    server: proxy.example.invalid
    port: 443
    uuid: 00000000-0000-0000-0000-000000000000
    network: ws
    tls: true
    servername: proxy.example.invalid
    ws-opts:
      path: /example
      headers:
        Host: proxy.example.invalid

proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Example-VLESS

rules:
  - MATCH,Proxy
