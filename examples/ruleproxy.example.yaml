# Safe starter config. Replace the documentation-only node values with your
# own subscription nodes before using it. This file contains no real credentials.
# The panel pins its generated app listener to the selected proxy; it does not
# support DIRECT exceptions for that app.
proxies:
  - name: Example-VLESS
    type: vless
    server: proxy.example.invalid
    port: 443
    uuid: 00000000-0000-0000-0000-000000000000
    network: ws
    tls: true
    servername: proxy.example.invalid
    ws-opts:
      path: /example
      headers:
        Host: proxy.example.invalid

proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Example-VLESS

rules:
  - MATCH,Proxy
