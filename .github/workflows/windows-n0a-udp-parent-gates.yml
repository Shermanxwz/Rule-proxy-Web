name: UDP descendant parent standalone mechanics
on:
  push:
    branches: [dot/windows-isolation-proof]
    paths:
      - '.github/native/windows_n0a_udp_parent.cpp'
      - '.github/native/windows_n0a_udp_parent_fixture.cpp'
      - '.github/build_windows_n0a_udp_parent.ps1'
      - '.github/build_windows_n0a_udp_parent_fixture.ps1'
      - '.github/test_windows_n0a_udp_parent.py'
      - '.github/workflows/windows-n0a-udp-parent-gates.yml'
      - 'tests/test_windows_n0a_udp_parent_actor.py'
      - 'tests/test_windows_n0a_udp_parent_gate.py'
      - 'tests/test_windows_n0a_udp_parent_workflow.py'
      - 'docs/validation/2026-10-21-udp-descendant-mechanism.md'
permissions:
  contents: read
concurrency:
  group: n0a-udp-parent-gates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pure:
    if: ${{ github.ref == 'refs/heads/dot/windows-isolation-proof' && github.event_name == 'push' && contains(github.event.head_commit.message, '[n0a-udp-parent-gates]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Required parent and unchanged UDP contracts
        run: |
          python3 -m pip install --disable-pip-version-check "PyYAML==6.0.3"
          python3 -B -c "import pathlib,unittest; names=('test_windows_n0a_udp_actor.py', 'test_windows_client_n0a_udp.py', 'test_windows_n0a_udp_gate.py', 'test_windows_client_n0a_udp_packet.py', 'test_windows_n0a_udp_workflow.py', 'test_windows_client_n0a_udp_guest.py', 'test_windows_client_n0a_udp_flow.py', 'test_windows_client_n0a_udp_host.py', 'test_windows_client_n0a_udp_capture_adapter.py', 'test_windows_udp_guest_transport.py', 'test_windows_udp_payload.py', 'test_windows_udp_flow_composed.py', 'test_windows_n0a_actor.py', 'test_windows_client_n0a_control.py', 'test_windows_n0a_workflow.py', 'test_windows_client_n0a_adapter.py', 'test_windows_client_n0a_host.py', 'test_windows_client_n0a_flow.py', 'test_windows_client_n0a_capture_adapter.py', 'test_windows_client_n0a_packet.py', 'test_windows_n0a_guest.py', 'test_windows_client_direct_stage0.py', 'test_windows_client_direct_guest.py', 'test_windows_client_direct_actor_projection.py', 'test_windows_client_direct_workflow.py', 'test_windows_n0a_udp_parent_actor.py', 'test_windows_n0a_udp_parent_gate.py', 'test_windows_n0a_udp_parent_workflow.py'); assert all((pathlib.Path('tests')/n).is_file() for n in names); parts=[unittest.defaultTestLoader.discover('tests',pattern=n) for n in names]; assert all(p.countTestCases()>0 for p in parts); result=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(parts)); raise SystemExit(not result.wasSuccessful() or bool(result.skipped))"
  native-mechanism:
    if: ${{ github.ref == 'refs/heads/dot/windows-isolation-proof' && github.event_name == 'push' && contains(github.event.head_commit.message, '[n0a-udp-parent-gates]') }}
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Parse separate parent build helpers
        shell: powershell
        run: |
          foreach ($name in @('parent','parent_fixture')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD ".github/build_windows_n0a_udp_$name.ps1"),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw 'Parent helper syntax rejected' }
          }
      - name: Compile pinned production parent and separate fixture outputs
        shell: pwsh
        run: |
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs=& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Installed MSVC unavailable' }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          ./.github/build_windows_n0a_udp_parent.ps1 -OutputDirectory "$PWD/udp-parent-production-build" -ExpectedParentSha256 8bad2b37478a92e18ccde3abf245c349c61285ca514445f3d61199adc0d86642 -ExpectedChildSourceSha256 dea64f0f25d60930be13c4f9e24b41f7535d1021476e6180d6bfe3361b40d0f2 -ExpectedIdentitySha256 530482aae4c94707ae4da25c1c3e84d8da929a021fc23b09e59fec17fe28d553
          ./.github/build_windows_n0a_udp_parent_fixture.ps1 -OutputDirectory "$PWD/udp-parent-TEST-ONLY-build" -ExpectedParentSha256 8bad2b37478a92e18ccde3abf245c349c61285ca514445f3d61199adc0d86642 -ExpectedFixtureSha256 6712f8a4831924e619911f5952d1f3cd22786357db9337e0a8b2d8bd028c3301 -ExpectedChildSourceSha256 dea64f0f25d60930be13c4f9e24b41f7535d1021476e6180d6bfe3361b40d0f2 -ExpectedIdentitySha256 530482aae4c94707ae4da25c1c3e84d8da929a021fc23b09e59fec17fe28d553
          ./.github/build_windows_n0a_udp_fixture.ps1 -OutputDirectory "$PWD/udp-child-TEST-ONLY-build" -ExpectedFixtureSha256 9465f6fd4399b4e7edc357dcfaf7769905aa74392c423f05142fa9f49896bbae -ExpectedActorSha256 dea64f0f25d60930be13c4f9e24b41f7535d1021476e6180d6bfe3361b40d0f2 -ExpectedIdentitySha256 530482aae4c94707ae4da25c1c3e84d8da929a021fc23b09e59fec17fe28d553
      - name: Required parent and unchanged UDP contracts
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
          if ($LASTEXITCODE -ne 0) { throw "yaml_test_dependency_install_failed" }
          python -B -c "import pathlib,unittest; names=('test_windows_n0a_udp_actor.py', 'test_windows_client_n0a_udp.py', 'test_windows_n0a_udp_gate.py', 'test_windows_client_n0a_udp_packet.py', 'test_windows_n0a_udp_workflow.py', 'test_windows_client_n0a_udp_guest.py', 'test_windows_client_n0a_udp_flow.py', 'test_windows_client_n0a_udp_host.py', 'test_windows_client_n0a_udp_capture_adapter.py', 'test_windows_udp_guest_transport.py', 'test_windows_udp_payload.py', 'test_windows_udp_flow_composed.py', 'test_windows_n0a_actor.py', 'test_windows_client_n0a_control.py', 'test_windows_n0a_workflow.py', 'test_windows_client_n0a_adapter.py', 'test_windows_client_n0a_host.py', 'test_windows_client_n0a_flow.py', 'test_windows_client_n0a_capture_adapter.py', 'test_windows_client_n0a_packet.py', 'test_windows_n0a_guest.py', 'test_windows_client_direct_stage0.py', 'test_windows_client_direct_guest.py', 'test_windows_client_direct_actor_projection.py', 'test_windows_client_direct_workflow.py', 'test_windows_n0a_udp_parent_actor.py', 'test_windows_n0a_udp_parent_gate.py', 'test_windows_n0a_udp_parent_workflow.py'); assert all((pathlib.Path('tests')/n).is_file() for n in names); parts=[unittest.defaultTestLoader.discover('tests',pattern=n) for n in names]; assert all(p.countTestCases()>0 for p in parts); result=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(parts)); raise SystemExit(not result.wasSuccessful() or bool(result.skipped))"
          if ($LASTEXITCODE -ne 0) { throw 'Parent required tests failed' }
      - name: Owned loopback parent child mechanism and lifecycle negatives
        shell: pwsh
        run: |
          python -B .github/test_windows_n0a_udp_parent.py --run-actual-windows --production-parent udp-parent-production-build/windows_n0a_udp_parent.exe --production-manifest udp-parent-production-build/N0A-UDP-PARENT-manifest.json --fixture-parent udp-parent-TEST-ONLY-build/windows_n0a_UDP_PARENT_TEST_ONLY_fixture.exe --fixture-manifest udp-parent-TEST-ONLY-build/PARENT-TEST-ONLY-manifest.json --child-actor udp-child-TEST-ONLY-build/windows_n0a_UDP_TEST_ONLY_fixture.exe --child-manifest udp-child-TEST-ONLY-build/UDP-TEST-ONLY-manifest.json --output udp-parent-mechanism-public.json
          if ($LASTEXITCODE -ne 0) { throw 'Parent mechanism failed' }
