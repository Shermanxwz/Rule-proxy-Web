name: Windows ProxiFyre product qualification

on:
  workflow_dispatch:
    inputs:
      native_windows_11:
        description: Run the complete native Windows 11 qualification
        type: boolean
        default: true
      global_capture:
        description: Run the unqualified global capture experiment on a disposable host
        type: boolean
        default: false
  push:
    branches:
      - 'codex/windows-proxifyre-product-*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - name: Build the final offline ZIP
        run: python -B .github/build_windows_package.py windows-product-package
      - uses: actions/upload-artifact@v7
        with:
          name: windows-proxifyre-product-package
          path: windows-product-package/
          if-no-files-found: error
          retention-days: 7

  server-product:
    name: Final ZIP · Server 2025 · ordinary user
    needs: package
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          name: windows-proxifyre-product-package
          path: windows-product-package
      - name: Exercise installed product as a new ordinary user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'RuleProxyProduct'
          $text = [guid]::NewGuid().ToString('N') + 'Q7!'
          $password = ConvertTo-SecureString $text -AsPlainText -Force
          $user = New-LocalUser -Name $name -Password $password -PasswordNeverExpires
          Add-LocalGroupMember -Group (Get-LocalGroup -SID 'S-1-5-32-545').Name -Member $name
          $env:RULEPROXY_TEST_USER = $name
          $env:RULEPROXY_TEST_PASSWORD = $text
          $env:RULEPROXY_TEST_SID = $user.SID.Value
          try {
            python -B .github/windows_proxifyre_product_acceptance.py --package-dir windows-product-package --output windows-product-results
            $result = $LASTEXITCODE
          } finally {
            Remove-Item Env:RULEPROXY_TEST_PASSWORD -ErrorAction SilentlyContinue
            Remove-Item Env:RULEPROXY_TEST_USER -ErrorAction SilentlyContinue
            Remove-Item Env:RULEPROXY_TEST_SID -ErrorAction SilentlyContinue
            Remove-LocalUser -Name $name -ErrorAction SilentlyContinue
          }
          if ($result -ne 0) { throw 'Product qualification failed or requires reboot; inspect artifacts' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-proxifyre-server-product-evidence
          path: windows-product-results/
          if-no-files-found: warn
          retention-days: 14

  native-windows-11:
    name: Final ZIP · Windows 11 x64 · native KVM
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.native_windows_11
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          name: windows-proxifyre-product-package
          path: windows-product-package
      - name: Prepare space on the disposable hosted runner
        run: |
          mkdir -p windows-native-product-results
          {
            date -u
            uname -a
            lscpu
            free -b
            df -B1 /tmp .
            cat /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current 2>/dev/null || true
          } > windows-native-product-results/host-preflight.txt
          available=$(df -B1 --output=avail /tmp | tail -n 1)
          if [ "$available" -lt 59055800320 ]; then
            sudo rm -rf -- /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/chromium /usr/local/share/powershell/Modules
            sudo docker system prune --all --force --volumes || true
          fi
          df -h /
      - name: Prepare disposable native VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf swtpm xorriso curl 7zip
      - name: Qualify the installed product on the official client Windows kernel
        run: |
          read -r expected name < windows-product-package/SHA256SUMS.txt
          exec timeout --signal=TERM --kill-after=20s 45m sudo "$(command -v python)" -B .github/windows_proxifyre_vm.py \
            --package "windows-product-package/$name" --package-sha256 "$expected" \
            --artifacts windows-native-product-results --timeout-seconds 2700
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-proxifyre-native-product-evidence
          path: windows-native-product-results/
          if-no-files-found: warn
          retention-days: 14

  global-server-capture:
    name: Global TUN and independent guard · disposable Server 2025
    if: github.event_name == 'workflow_dispatch' && inputs.global_capture
    needs: package
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          name: windows-proxifyre-product-package
          path: windows-product-package
      - name: Verify and unpack the final offline package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = (Get-Content windows-product-package/SHA256SUMS.txt -Raw).Trim() -split '\s+'
          if ($receipt.Count -ne 2 -or $receipt[0] -notmatch '^[a-f0-9]{64}$' -or $receipt[1] -notmatch '^[A-Za-z0-9._-]+\.zip$') { throw 'Invalid package checksum receipt' }
          $archive = Join-Path windows-product-package $receipt[1]
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $receipt[0]) { throw 'Package checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath capture-package
          New-Item -ItemType Directory -Path windows-global-results -Force | Out-Null
          Copy-Item windows-product-package/SHA256SUMS.txt windows-global-results/
      - name: Install for the actual runner owner without starting a panel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path capture-package/RuleProxy-Web).Path
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & "$source/scripts/windows-setup.ps1" -SourceRoot $source -OwnerSid $sid -Elevated -NoLaunch
          if ($LASTEXITCODE -ne 0) { throw ('Installation incomplete; exit ' + $LASTEXITCODE) }
      - name: Test actual capture with an independent SYSTEM recovery deadline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:ProgramFiles 'RuleProxy-Web'
          & "$root/python/python.exe" -I -S -B .github/check_windows_global_capture.py --ack-disposable-windows --installed-root $root --output windows-global-results/summary.json
          if ($LASTEXITCODE -ne 0) { throw 'Native capture acceptance failed; inspect the bounded summary' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-global-native-evidence
          path: windows-global-results/
          if-no-files-found: error
          retention-days: 14
