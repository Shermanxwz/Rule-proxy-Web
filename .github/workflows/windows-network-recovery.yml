name: Windows offline network recovery
on:
  push:
    paths:
      - scripts/windows-network-recover.ps1
      - Recover-Windows-Network.cmd
      - .github/test_network_recovery*.ps1
      - tests/test_windows_network_recover_script.py
      - .github/build_network_recovery_package.py
      - downloads/**
      - .github/workflows/windows-network-recovery.yml
  pull_request:
    paths:
      - scripts/windows-network-recover.ps1
      - Recover-Windows-Network.cmd
      - .github/test_network_recovery*.ps1
      - tests/test_windows_network_recover_script.py
      - .github/build_network_recovery_package.py
      - downloads/**
      - .github/workflows/windows-network-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Offline script contracts, executable behavior and real WFP/NRPT fixtures
        run: python -B -m unittest tests.test_windows_network_recover_script -v
      - name: Build two-file offline recovery ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -B .github/build_network_recovery_package.py
          git diff --exit-code -- downloads
      - uses: actions/upload-artifact@v7
        with:
          name: RuleProxy-Network-Recovery
          path: |
            downloads/RuleProxy-Network-Recovery.zip
            downloads/SHA256SUMS.txt
