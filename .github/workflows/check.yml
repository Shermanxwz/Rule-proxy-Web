name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux · Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install bubblewrap and load the project's AppArmor policy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor
          sudo sh scripts/setup-linux-apparmor.sh
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests, with the real network sandbox
        env:
          # Sandbox tests must run here, not skip.
          RULEPROXY_REQUIRE_ISOLATION: "1"
        run: python -B .github/run_tests.py

  windows:
    name: Windows · Python 3.13
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests, including real shell links
        run: python -B .github/run_tests.py
