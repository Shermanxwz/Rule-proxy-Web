name: Check

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      baseline_diagnostic:
        description: Test the official ISO build without the cumulative update (diagnostic only)
        required: false
        type: boolean
        default: false
      capability_executor_diagnostic:
        description: Use the fixed G source-only executor for native diagnostics (never product acceptance)
        required: false
        type: boolean
        default: false
      gui_diagnostic_only:
        description: Run only the strict policy probe and GUI diagnostic; never product acceptance
        required: false
        type: boolean
        default: false
      chromium_gui_control_diagnostic:
        description: Include pinned Chrome for Testing only as a GUI diagnostic control; never product acceptance
        required: false
        type: boolean
        default: false
      standard_profile_layout_control:
        description: Test the pinned CfT GUI with ordinary profile layout and no extra directory enumeration grant
        required: false
        type: boolean
        default: false
      network_diagnostic_only:
        description: Run only the strict policy probe and preferred-policy network experiment; never product acceptance
        required: false
        type: boolean
        default: false
      singleton_port_range_diagnostic:
        description: Compare equivalent singleton TCP port encoding using the original SDK in network diagnostic-only mode
        required: false
        type: boolean
        default: false
      psec_1_1_diagnostic:
        description: Run the preferred network experiment with PSEC 1.1 in diagnostic-only mode
        required: false
        type: boolean
        default: false
      ingress_controls_diagnostic:
        description: Use G2 for source-only private-network capability or Chromium GUI diagnostics
        required: false
        type: boolean
        default: false
      internal_tcp_policy_diagnostic:
        description: G3 internal TCP policy comparison for singleton-port or loopback-scope controls (source-only)
        required: false
        type: choice
        options:
          - none
          - singleton
          - loopback
        default: none

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-mxc-g-bundle:
    name: Verify fixed G artifact and assemble deterministic bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Prefer the published fixed G release asset
        id: g-release-asset
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import install_runtime

          output = Path('mxc-g-bundle.zip')
          try:
              data = install_runtime.fetch_g_bundle_release()
          except install_runtime.GBundleNotPublished:
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
                  stream.write('bootstrap_fallback=true\n')
              print('The v0.2.2 bundle asset is not published yet; using the fixed bootstrap artifact.')
          else:
              output.write_bytes(data)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
                  stream.write('bootstrap_fallback=false\n')
              print(f'Verified published G bundle SHA-256 {install_runtime.MXC_G_BUNDLE_SHA256}')
          PY
      - name: Download the fixed successful G build artifact for bootstrap
        if: steps.g-release-asset.outputs.bootstrap_fallback == 'true'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 11938733475
          run-id: 38660663692
          github-token: ${{ github.token }}
          repository: Shermanxwz/Rule-proxy-Web
          path: g-source-download
          skip-decompress: true
          digest-mismatch: error
      - name: Verify the artifact ZIP and assemble the pinned G bundle
        if: steps.g-release-asset.outputs.bootstrap_fallback == 'true'
        run: |
          python -B - <<'PY'
          import hashlib
          import json
          from pathlib import Path, PurePosixPath
          import stat
          import zipfile
          import install_runtime

          downloads = [path for path in Path('g-source-download').iterdir() if path.is_file()]
          if len(downloads) != 1:
              raise SystemExit('Expected one raw artifact archive')
          archive_path = downloads[0]
          if hashlib.sha256(archive_path.read_bytes()).hexdigest() != '8a771727002d5f6f03ff00f5e26f99340fbbd17383dc7405ba99f7dd3388f036':
              raise SystemExit('Fixed G build artifact ZIP digest mismatch')
          required = {'build-manifest.json', 'wxc-exec.exe', 'MXC-LICENSE.md'}
          source = Path('g-source')
          source.mkdir()
          with zipfile.ZipFile(archive_path) as artifact:
              selected = {}
              for info in artifact.infolist():
                  name = PurePosixPath(info.filename)
                  if name.is_absolute() or '..' in name.parts or ':' in info.filename or '\\' in info.filename:
                      raise SystemExit('Unsafe member in pinned G build artifact')
                  if info.is_dir():
                      continue
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit('Symlink in pinned G build artifact')
                  leaf = name.name
                  if leaf in required:
                      if leaf in selected:
                          raise SystemExit('Duplicate fixed G build artifact member')
                      selected[leaf] = info
              if set(selected) != required:
                  raise SystemExit('Pinned G build artifact is missing required members')
              for leaf, info in selected.items():
                  (source / leaf).write_bytes(artifact.read(info))

          bundle = Path('mxc-g-bundle.zip')
          digest = install_runtime.build_g_bundle(source, bundle)
          if digest != install_runtime.MXC_G_BUNDLE_SHA256:
              raise SystemExit('Deterministic G bundle SHA-256 mismatch')
          extracted = Path('verified-g-bundle')
          extracted.mkdir()
          install_runtime._extract_g_bundle(bundle.read_bytes(), extracted)
          if hashlib.sha256((extracted / 'wxc-exec.exe').read_bytes()).hexdigest() != install_runtime.MXC_G_EXECUTOR_SHA256:
              raise SystemExit('Bundled G executor SHA-256 mismatch')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: fixed-mxc-g-bundle
          path: mxc-g-bundle.zip
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux · Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # The interpreter here is not the one apt serves, so this also covers the PyYAML fallback into vendor/.
      - name: One-step setup, as a user runs it
        run: sh setup-linux.sh
      - name: Tests, with the real network sandbox
        env:
          # Sandbox tests must run here, not skip.
          RULEPROXY_REQUIRE_ISOLATION: "1"
        run: python -B .github/run_tests.py
      - name: Start the panel with start-linux.sh and run the core
        run: python -B .github/smoke_panel.py sh start-linux.sh

  linux-system:
    name: Ubuntu ${{ matrix.ubuntu }} · system Python
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
    steps:
      - uses: actions/checkout@v5
      - name: Setup refuses to run as root
        run: |
          if sudo sh setup-linux.sh; then
            echo "::error title=Setup::setup-linux.sh ran as root"
            exit 1
          fi
      - name: One-step setup, as a user runs it
        run: sh setup-linux.sh
      - name: A second run finds everything in place
        run: sh setup-linux.sh --check && sh setup-linux.sh
      - name: Tests, with the real network sandbox
        env:
          RULEPROXY_REQUIRE_ISOLATION: "1"
        run: python3 -B .github/run_tests.py
      - name: Start the panel with start-linux.sh and run the core
        run: python3 -B .github/smoke_panel.py sh start-linux.sh

  windows:
    name: Windows · Python 3.13
    needs: pinned-mxc-g-bundle
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: fixed-mxc-g-bundle
          path: g-bundle
      - name: Verify the fixed bundle and select it for source-checkout runtime setup
        run: |
          @'
          import hashlib
          from pathlib import Path
          import install_runtime

          bundle = Path('g-bundle/mxc-g-bundle.zip').resolve(strict=True)
          data = install_runtime._g_bundle_bytes(bundle, allow_env_cache=False)
          extracted = Path('g-bundle/verified')
          extracted.mkdir()
          install_runtime._extract_g_bundle(data, extracted)
          assert hashlib.sha256((extracted / 'wxc-exec.exe').read_bytes()).hexdigest() == install_runtime.MXC_G_EXECUTOR_SHA256
          print(f'Verified pinned G bundle {hashlib.sha256(data).hexdigest()}')
          '@ | python -B -
          "RULEPROXY_PINNED_G_BUNDLE=$((Resolve-Path g-bundle\mxc-g-bundle.zip).Path)" >> $env:GITHUB_ENV
      - name: Validate unattended guest PowerShell scripts
        run: |
          Get-ChildItem .github\windows-vm-*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: Tests, including real shell links
        run: python -B .github/run_tests.py
      - name: Start-Windows.cmd in a source checkout sets up once, then runs the panel and core
        run: |
          $source = 'C:\源码 !测试%路径'
          New-Item -ItemType Directory -Path $source | Out-Null
          Copy-Item -Path "$env:GITHUB_WORKSPACE\*" -Destination $source -Recurse
          python -B .github\smoke_panel.py "$source\Start-Windows.cmd"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B .github\smoke_panel.py "$source\Start-Windows.cmd"

  windows-package:
    name: Windows package · build
    needs: pinned-mxc-g-bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Record actual KVM availability for a future Windows 11 guest
        run: sudo "$(command -v python)" -B .github/probe_kvm.py --report windows-vm-host.json
      - uses: actions/upload-artifact@v7
        with:
          name: windows-vm-host
          path: windows-vm-host.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/download-artifact@v8
        with:
          name: fixed-mxc-g-bundle
          path: g-bundle
      - name: Verify the fixed G bundle for package construction
        run: |
          python -B - <<'PY'
          import hashlib
          from pathlib import Path
          import install_runtime

          bundle = Path('g-bundle/mxc-g-bundle.zip').resolve(strict=True)
          data = install_runtime._g_bundle_bytes(bundle, allow_env_cache=False)
          extracted = Path('g-bundle/verified')
          extracted.mkdir()
          install_runtime._extract_g_bundle(data, extracted)
          if hashlib.sha256((extracted / 'wxc-exec.exe').read_bytes()).hexdigest() != install_runtime.MXC_G_EXECUTOR_SHA256:
              raise SystemExit('Pinned G executor digest mismatch')
          PY
      - name: Build the release package with the fixed G bundle
        run: python -B .github/build_windows_package.py dist --mxc-g-bundle "$PWD/g-bundle/mxc-g-bundle.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: dist/
          if-no-files-found: error
          retention-days: 30
      # 0.2.0 shipped MXC's plm.exe; unpacking a newer package over it leaves it in place.
      - name: Keep MXC's plm.exe aside, to test that the panel removes one an older package left
        run: |
          python -B - <<'EOF'
          import base64, hashlib, io, pathlib, tarfile
          import install_runtime as runtime
          data = runtime.fetch(runtime.MXC_URL)
          assert base64.b64encode(hashlib.sha512(data).digest()).decode() == runtime.MXC_SHA512
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
              plm = archive.extractfile("package/bin/x64/plm.exe").read()
          folder = pathlib.Path("older-package")
          folder.mkdir()
          (folder / "plm.exe").write_bytes(plm)
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: older-package-plm
          path: older-package/
          if-no-files-found: error
          retention-days: 7

  windows-package-test:
    name: Windows package · test
    needs: windows-package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: windows-package
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: older-package-plm
          path: older-package
      # A top folder that starts with a Chinese character, as in C:\应用: MXC 1.0.0 mishandles that.
      - name: Unpack, as a user does, under C:\应用 !测试%路径
        run: |
          $zip = Get-Item dist\RuleProxy-Web-*-windows-x64.zip
          $expected = ((Get-Content dist\SHA256SUMS.txt) -split '\s+')[0]
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw "The package does not match SHA256SUMS.txt" }
          $dest = 'C:\应用 !测试%路径'
          Expand-Archive $zip -DestinationPath $dest
          $package = Join-Path $dest 'RuleProxy-Web'
          if (Test-Path "$package\bin\windows-amd64\plm.exe") { throw "The package must not ship plm.exe" }
          $allowed = 'bin', 'examples', 'python', 'ruleproxy', 'vendor', 'web', 'CHANGELOG.md', 'LICENSE', 'README.md', 'Run-RuleProxy.py', 'Start-Windows.cmd', 'THIRD-PARTY.md'
          $unexpected = Get-ChildItem $package -Name | Where-Object { $_ -notin $allowed }
          if ($unexpected) { throw "Unexpected files in the package: $unexpected" }
          "PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # -X utf8: the path holds Chinese characters and this pipe is cp1252; the embedded Python ignores PYTHON* variables.
      - name: The package's Python runs on its own
        run: '& "$env:PACKAGE\python\python.exe" -X utf8 -c "import sys, ruleproxy, yaml; print(sys.version); print(sys.flags.isolated, sys.path); print(ruleproxy.__file__); print(yaml.__file__, yaml.__with_libyaml__)"'
      - name: Tests with the package's Python and code
        run: '& "$env:PACKAGE\python\python.exe" -B .github\run_tests.py --code "$env:PACKAGE"'
      - name: Put back the plm.exe an older package left, as after unpacking over 0.2.0
        run: Copy-Item older-package\plm.exe "$env:PACKAGE\bin\windows-amd64\plm.exe"
      - name: With plm.exe present, MXC 1.0.0 crashes on this path and the panel explains why
        run: '& "$env:PACKAGE\python\python.exe" -B .github\mxc_path_check.py "$env:PACKAGE"'
      - name: Start the panel with Start-Windows.cmd and run the bundled core
        run: '& "$env:PACKAGE\python\python.exe" -B .github\smoke_panel.py "$env:PACKAGE\Start-Windows.cmd"'
      - name: The panel removed the unused plm.exe
        run: if (Test-Path "$env:PACKAGE\bin\windows-amd64\plm.exe") { throw "plm.exe is still in the package" }

  windows-11-probe:
    name: Windows 11 ARM · real PSEC fixtures
    needs: windows-package
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: windows-package
          path: dist
      - name: Collect independent lightweight network-policy experiments
        id: network-experiment
        run: |
          $zip = Get-Item dist\RuleProxy-Web-*-windows-x64.zip
          $expected = ((Get-Content dist\SHA256SUMS.txt) -split '\s+')[0]
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw "Package checksum mismatch" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ruleproxy-probe"
          $root = "$env:RUNNER_TEMP\ruleproxy-probe\RuleProxy-Web"
          & "$root\python\python.exe" -X utf8 -B .github\windows_network_experiment.py --root "$root" --allow-emulated-x64 --report windows-network-experiments.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect stock Edge UI-policy and actual job-context diagnostics
        id: edge-ui-experiment
        if: ${{ !cancelled() && steps.network-experiment.outcome == 'success' }}
        continue-on-error: true
        run: |
          $root = "$env:RUNNER_TEMP\ruleproxy-probe\RuleProxy-Web"
          & "$root\python\python.exe" -X utf8 -B .github\windows_edge_policy_experiment.py --root "$root" --allow-emulated-x64 --report windows-edge-ui.json
          $code = $LASTEXITCODE
          if (Test-Path windows-edge-ui.json) {
            $value = Get-Content windows-edge-ui.json -Raw | ConvertFrom-Json
            $unchanged = @($value.checks | Where-Object { $_.check -eq 'host_proxy_dns_default_routes_unchanged' -and $_.status -eq 'passed' }).Count -eq 1
            if ($value.cleanup_proven -eq $true -and -not $value.cleanup_error -and -not $value.recovery_directory -and $unchanged) {
              'cleanup_safe=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            }
          }
          if ($code -ne 0) { exit $code }
      - name: Probe the fixed x64 runtime on a real Windows 11 kernel
        id: psec-probe
        if: ${{ !cancelled() && steps.network-experiment.outcome == 'success' && (steps.edge-ui-experiment.outcome == 'success' || steps.edge-ui-experiment.outputs.cleanup_safe == 'true') }}
        run: |
          $zip = Get-Item dist\RuleProxy-Web-*-windows-x64.zip
          $expected = ((Get-Content dist\SHA256SUMS.txt) -split '\s+')[0]
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw "Package checksum mismatch" }
          $root = "$env:RUNNER_TEMP\ruleproxy-probe\RuleProxy-Web"
          & "$root\python\python.exe" -X utf8 -B scripts\windows-acceptance.py --root "$root" --probe-only --report windows-11-probe.json
          $probeExit = $LASTEXITCODE
          if ($probeExit -eq 3) {
            Write-Output '::notice title=Windows 11 probe::This host cannot service the fixed strict policy. Full acceptance remains pending.'
            exit 0
          }
          if ($probeExit -ne 0) { exit $probeExit }
          Write-Output '::notice title=Windows 11 probe::Capability probe passed on ARM with the x64 runtime. Full native x64 acceptance remains pending.'
      - name: Validate real PSEC transport, parent and child blocking, and safe stop
        if: ${{ !cancelled() && steps.psec-probe.outcome == 'success' }}
        run: |
          $probe = Get-Content windows-11-probe.json -Raw | ConvertFrom-Json
          if (-not $probe.probe.supported) {
            Write-Output '::notice title=PSEC transport::Unavailable on this runner; no transport acceptance claimed.'
            exit 0
          }
          $root = "$env:RUNNER_TEMP\ruleproxy-probe\RuleProxy-Web"
          & "$root\python\python.exe" -X utf8 -B scripts\windows-acceptance.py --root "$root" --transport-fixture --allow-emulated-x64 --report windows-11-transport.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate the real Manager and Mihomo, normal stop, and core-loss cleanup
        if: ${{ !cancelled() && steps.psec-probe.outcome == 'success' }}
        run: |
          $probe = Get-Content windows-11-probe.json -Raw | ConvertFrom-Json
          if (-not $probe.probe.supported) {
            Write-Output '::notice title=PSEC manager::Unavailable on this runner; no manager acceptance claimed.'
            exit 0
          }
          $root = "$env:RUNNER_TEMP\ruleproxy-probe\RuleProxy-Web"
          if (-not (Test-Path windows-11-transport.json)) {
            @{ status = 'blocked'; manager_fixture_passed = $false; acceptance_passed = $false; real_node_passed = $false; detail = 'Transport returned no cleanup report; no new container was launched.' } | ConvertTo-Json | Set-Content windows-11-manager.json -Encoding utf8
            exit 1
          }
          $previous = Get-Content windows-11-transport.json -Raw | ConvertFrom-Json
          if ($previous.cleanup_error -or $previous.recovery_directory) {
            @{ status = 'blocked'; manager_fixture_passed = $false; acceptance_passed = $false; real_node_passed = $false; detail = 'Previous fixture retained cleanup resources; no new container was launched.' } | ConvertTo-Json | Set-Content windows-11-manager.json -Encoding utf8
            exit 1
          }
          & "$root\python\python.exe" -X utf8 -B scripts\windows-acceptance.py --root "$root" --manager-fixture --allow-emulated-x64 --report windows-11-manager.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render a real Edge page and retain private-profile cookies in PSEC
        if: ${{ !cancelled() && steps.psec-probe.outcome == 'success' }}
        run: |
          $probe = Get-Content windows-11-probe.json -Raw | ConvertFrom-Json
          if (-not $probe.probe.supported) {
            Write-Output '::notice title=PSEC browser::Unavailable on this runner; no browser acceptance claimed.'
            exit 0
          }
          $root = "$env:RUNNER_TEMP\ruleproxy-probe\RuleProxy-Web"
          foreach ($name in @('windows-11-transport.json', 'windows-11-manager.json')) {
            if (-not (Test-Path $name)) {
              @{ status = 'blocked'; browser_fixture_passed = $false; acceptance_passed = $false; real_node_passed = $false; detail = 'A previous fixture returned no cleanup report; no new container was launched.' } | ConvertTo-Json | Set-Content windows-browser.json -Encoding utf8
              exit 1
            }
            $previous = Get-Content $name -Raw | ConvertFrom-Json
            if ($previous.cleanup_error -or $previous.recovery_directory -or $previous.status -eq 'blocked') {
              @{ status = 'blocked'; browser_fixture_passed = $false; acceptance_passed = $false; real_node_passed = $false; detail = 'Previous fixture retained cleanup resources; no new container was launched.' } | ConvertTo-Json | Set-Content windows-browser.json -Encoding utf8
              exit 1
            }
          }
          & "$root\python\python.exe" -X utf8 -B .github\windows_browser_check.py --root "$root" --allow-emulated-x64 --report windows-browser.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require actual fixture results before the ARM job can pass
        if: ${{ !cancelled() }}
        run: |
          foreach ($name in @('windows-network-experiments.json', 'windows-edge-ui.json', 'windows-11-probe.json', 'windows-11-transport.json', 'windows-11-manager.json', 'windows-browser.json')) {
            if (-not (Test-Path $name)) { throw "Required Windows result missing: $name" }
            $value = Get-Content $name -Raw | ConvertFrom-Json
            if ($value.cleanup_error -or $value.recovery_directory -or $value.status -eq 'blocked') { throw "Unproven cleanup: $name" }
          }
          $experiment = Get-Content windows-network-experiments.json -Raw | ConvertFrom-Json
          if ($experiment.cleanup_proven -ne $true -or $experiment.status -ne 'experiment_only') { throw 'Experiment collection/cleanup did not complete' }
          $edge = Get-Content windows-edge-ui.json -Raw | ConvertFrom-Json
          if ($edge.cleanup_proven -ne $true -or $edge.status -ne 'experiment_only' -or $edge.browser_fixture_passed -ne $false) { throw 'UI diagnostics did not finish without claiming product acceptance' }
          $probe = Get-Content windows-11-probe.json -Raw | ConvertFrom-Json
          $transport = Get-Content windows-11-transport.json -Raw | ConvertFrom-Json
          $manager = Get-Content windows-11-manager.json -Raw | ConvertFrom-Json
          $browser = Get-Content windows-browser.json -Raw | ConvertFrom-Json
          if (-not $probe.probe.supported -or -not $transport.transport_passed -or -not $manager.manager_fixture_passed -or -not $manager.manager_normal_stop_passed -or -not $manager.manager_core_loss_passed -or -not $browser.browser_fixture_passed) {
            throw 'Windows ARM capability or a required real fixture remains unverified'
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-11-probe
          path: |
            windows-11-probe.json
            windows-11-transport.json
            windows-11-manager.json
            windows-browser.json
            windows-network-experiments.json
            windows-edge-ui.json
          if-no-files-found: error
          retention-days: 30

  windows-11-x64:
    name: Windows 11 x64 · real KVM guest
    needs: windows-package
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: windows-package
          path: dist
      - name: Validate mutually exclusive diagnostic modes
        if: github.event_name == 'workflow_dispatch'
        env:
          GUI_DIAGNOSTIC: ${{ inputs.gui_diagnostic_only }}
          CHROMIUM_CONTROL: ${{ inputs.chromium_gui_control_diagnostic }}
          NETWORK_DIAGNOSTIC: ${{ inputs.network_diagnostic_only }}
          CAPABILITY_DIAGNOSTIC: ${{ inputs.capability_executor_diagnostic }}
          SINGLETON_DIAGNOSTIC: ${{ inputs.singleton_port_range_diagnostic }}
          PSEC_1_1_DIAGNOSTIC: ${{ inputs.psec_1_1_diagnostic }}
          INGRESS_CONTROLS: ${{ inputs.ingress_controls_diagnostic }}
          INTERNAL_TCP_POLICY: ${{ inputs.internal_tcp_policy_diagnostic }}
          STANDARD_PROFILE_CONTROL: ${{ inputs.standard_profile_layout_control }}
        run: |
          if [ "$GUI_DIAGNOSTIC" = 'true' ] && [ "$CAPABILITY_DIAGNOSTIC" = 'true' ] && [ "$CHROMIUM_CONTROL" != 'true' ]; then
            echo 'GUI source-executor diagnostic requires the pinned Chromium control.' >&2
            exit 2
          fi
          if [ "$GUI_DIAGNOSTIC" = 'true' ] && [ "$NETWORK_DIAGNOSTIC" = 'true' ]; then
            echo 'GUI and network diagnostic-only modes are mutually exclusive.' >&2
            exit 2
          fi
          if [ "$CHROMIUM_CONTROL" = 'true' ] && { [ "$GUI_DIAGNOSTIC" != 'true' ] || [ "$NETWORK_DIAGNOSTIC" = 'true' ]; }; then
            echo 'Chromium control requires GUI-only diagnostic mode.' >&2
            exit 2
          fi
          if [ "$STANDARD_PROFILE_CONTROL" = 'true' ] && { [ "$GUI_DIAGNOSTIC" != 'true' ] || [ "$CHROMIUM_CONTROL" != 'true' ] || [ "$NETWORK_DIAGNOSTIC" = 'true' ] || [ "$PSEC_1_1_DIAGNOSTIC" = 'true' ] || [ "$SINGLETON_DIAGNOSTIC" = 'true' ] || [ "$INGRESS_CONTROLS" = 'true' ]; }; then
            echo 'Standard profile layout control requires CfT GUI-only mode and cannot combine with G2 or network axes.' >&2
            exit 2
          fi
          if [ "$SINGLETON_DIAGNOSTIC" = 'true' ] && { [ "$NETWORK_DIAGNOSTIC" != 'true' ] || [ "$CAPABILITY_DIAGNOSTIC" = 'true' ]; }; then
            echo 'Singleton port encoding requires network diagnostic-only with the original SDK.' >&2
            exit 2
          fi
          if [ "$INTERNAL_TCP_POLICY" != 'none' ] && {
              [ "$NETWORK_DIAGNOSTIC" != 'true' ] || [ "$CAPABILITY_DIAGNOSTIC" != 'true' ] ||
              [ "$GUI_DIAGNOSTIC" = 'true' ] || [ "$CHROMIUM_CONTROL" = 'true' ] ||
              [ "$INGRESS_CONTROLS" = 'true' ] || [ "$SINGLETON_DIAGNOSTIC" = 'true' ];
            }; then
            echo 'Internal TCP policy diagnostics require network-only G3 and cannot combine with GUI, G2 or the legacy singleton encoding.' >&2
            exit 2
          fi
          if [ "$PSEC_1_1_DIAGNOSTIC" = 'true' ] && { [ "$NETWORK_DIAGNOSTIC" != 'true' ] || [ "$SINGLETON_DIAGNOSTIC" = 'true' ]; }; then
            echo 'PSEC 1.1 diagnostic requires network-only mode and cannot combine with singleton port encoding.' >&2
            exit 2
          fi
          if [ "$INGRESS_CONTROLS" = 'true' ]; then
            network_g2=false
            gui_g2=false
            if [ "$NETWORK_DIAGNOSTIC" = 'true' ] && [ "$PSEC_1_1_DIAGNOSTIC" = 'true' ] && [ "$GUI_DIAGNOSTIC" != 'true' ] && [ "$CHROMIUM_CONTROL" != 'true' ] && [ "$SINGLETON_DIAGNOSTIC" != 'true' ]; then network_g2=true; fi
            if [ "$GUI_DIAGNOSTIC" = 'true' ] && [ "$CHROMIUM_CONTROL" = 'true' ] && [ "$NETWORK_DIAGNOSTIC" != 'true' ] && [ "$PSEC_1_1_DIAGNOSTIC" != 'true' ] && [ "$SINGLETON_DIAGNOSTIC" != 'true' ]; then gui_g2=true; fi
            if [ "$CAPABILITY_DIAGNOSTIC" != 'true' ] || { [ "$network_g2" != 'true' ] && [ "$gui_g2" != 'true' ]; }; then
              echo 'Ingress control requires either G2 network+PSEC 1.1 or G2 GUI+CfT diagnostics.' >&2
              exit 2
            fi
          fi
      - name: Download only the fixed G source-only diagnostic executor
        if: github.event_name == 'workflow_dispatch' && inputs.capability_executor_diagnostic && !inputs.ingress_controls_diagnostic && inputs.internal_tcp_policy_diagnostic == 'none'
        uses: actions/download-artifact@v8
        with:
          name: mxc-capability-executor
          run-id: 38660663692
          github-token: ${{ github.token }}
          path: mxc-capability
          digest-mismatch: error
      - name: Download only the fixed G2 private network capability control
        if: github.event_name == 'workflow_dispatch' && inputs.ingress_controls_diagnostic
        uses: actions/download-artifact@v8
        with:
          name: mxc-ingress-control-executor
          run-id: 38699568831
          github-token: ${{ github.token }}
          path: mxc-capability
          digest-mismatch: error
      - name: Download only the fixed G3 internal TCP policy diagnostic executor
        if: github.event_name == 'workflow_dispatch' && inputs.internal_tcp_policy_diagnostic != 'none'
        uses: actions/download-artifact@v8
        with:
          # Verified archive SHA-256: cdd267e499d85645df1395fb14054a13bfbc80d06ae50bce75a6cfa81fd2f67a
          artifact-ids: 11963865149
          run-id: 38717111262
          github-token: ${{ github.token }}
          repository: Shermanxwz/Rule-proxy-Web
          path: mxc-capability
          merge-multiple: true
          digest-mismatch: error
      - name: Install the VM tools on the ephemeral runner
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf swtpm xorriso curl 7zip
      - name: Run a checksum-verified official Windows 11 evaluation guest
        env:
          RULEPROXY_VM_BASELINE: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_diagnostic || false }}
          RULEPROXY_VM_TEST_EXECUTOR: ${{ github.event_name == 'workflow_dispatch' && inputs.capability_executor_diagnostic || false }}
          RULEPROXY_VM_GUI_DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.gui_diagnostic_only || false }}
          RULEPROXY_VM_CHROMIUM_CONTROL: ${{ github.event_name == 'workflow_dispatch' && inputs.chromium_gui_control_diagnostic || false }}
          RULEPROXY_VM_STANDARD_PROFILE_CONTROL: ${{ github.event_name == 'workflow_dispatch' && inputs.standard_profile_layout_control || false }}
          RULEPROXY_VM_NETWORK_DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.network_diagnostic_only || false }}
          RULEPROXY_VM_SINGLETON_DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.singleton_port_range_diagnostic || false }}
          RULEPROXY_VM_PSEC_1_1_DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.psec_1_1_diagnostic || false }}
          RULEPROXY_VM_INGRESS_CONTROLS: ${{ github.event_name == 'workflow_dispatch' && inputs.ingress_controls_diagnostic || false }}
          RULEPROXY_VM_INTERNAL_TCP_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.internal_tcp_policy_diagnostic || 'none' }}
        run: |
          package=$(find "$PWD/dist" -maxdepth 1 -name 'RuleProxy-Web-*-windows-x64.zip' -print -quit)
          digest=$(awk 'NR==1 {print $1}' dist/SHA256SUMS.txt)
          baseline_args=()
          if [ "$RULEPROXY_VM_BASELINE" = 'true' ]; then baseline_args+=(--baseline-diagnostic); fi
          executor_args=()
          if [ "$RULEPROXY_VM_TEST_EXECUTOR" = 'true' ]; then
            executor_args+=(--test-psec-executor "$PWD/mxc-capability/wxc-exec.exe" --test-psec-manifest "$PWD/mxc-capability/build-manifest.json")
          fi
          gui_args=()
          if [ "$RULEPROXY_VM_GUI_DIAGNOSTIC" = 'true' ]; then gui_args+=(--gui-diagnostic-only); fi
          if [ "$RULEPROXY_VM_CHROMIUM_CONTROL" = 'true' ]; then gui_args+=(--chromium-gui-control); fi
          if [ "$RULEPROXY_VM_STANDARD_PROFILE_CONTROL" = 'true' ]; then gui_args+=(--standard-profile-layout-control); fi
          if [ "$RULEPROXY_VM_INGRESS_CONTROLS" = 'true' ] && [ "$RULEPROXY_VM_GUI_DIAGNOSTIC" = 'true' ]; then gui_args+=(--ingress-controls-diagnostic); fi
          network_args=()
          if [ "$RULEPROXY_VM_NETWORK_DIAGNOSTIC" = 'true' ]; then network_args+=(--network-diagnostic-only); fi
          if [ "$RULEPROXY_VM_SINGLETON_DIAGNOSTIC" = 'true' ]; then network_args+=(--singleton-port-range-diagnostic); fi
          if [ "$RULEPROXY_VM_PSEC_1_1_DIAGNOSTIC" = 'true' ]; then network_args+=(--psec-1-1-diagnostic); fi
          if [ "$RULEPROXY_VM_INGRESS_CONTROLS" = 'true' ] && [ "$RULEPROXY_VM_NETWORK_DIAGNOSTIC" = 'true' ]; then network_args+=(--ingress-controls-diagnostic); fi
          if [ "$RULEPROXY_VM_INTERNAL_TCP_POLICY" != 'none' ]; then network_args+=(--internal-tcp-policy-diagnostic "$RULEPROXY_VM_INTERNAL_TCP_POLICY"); fi
          sudo "$(command -v python)" -B .github/windows_vm_test.py --package "$package" --package-sha256 "$digest" --artifacts "$PWD/windows-vm-artifacts" --timeout-seconds 10800 "${baseline_args[@]}" "${executor_args[@]}" "${gui_args[@]}" "${network_args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-11-x64-validation
          path: windows-vm-artifacts/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish the release
    needs: [linux, linux-system, windows, windows-package-test, windows-11-x64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: windows-package
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: fixed-mxc-g-bundle
          path: dist/g-bundle-download
      - name: Stage the verified G runtime bundle as a release asset
        run: |
          mkdir -p dist/g-bundle-staged
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import install_runtime

          downloads = [path for path in Path('dist/g-bundle-download').iterdir() if path.is_file()]
          if len(downloads) != 1:
              raise SystemExit('Expected one verified G bundle workflow artifact')
          data = install_runtime._g_bundle_bytes(downloads[0].resolve(strict=True), allow_env_cache=False)
          install_runtime._extract_g_bundle(data, Path('dist/g-bundle-staged'))
          if hashlib.sha256((Path('dist/g-bundle-staged') / 'wxc-exec.exe').read_bytes()).hexdigest() != install_runtime.MXC_G_EXECUTOR_SHA256:
              raise SystemExit('Release G executor digest mismatch')
          Path('dist/mxc-g-runtime-bundle.zip').write_bytes(data)
          print(f'Verified release bundle SHA-256 {install_runtime.MXC_G_BUNDLE_SHA256}')
          PY
      - name: Publish v<version> once; later pushes leave it alone until the version changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c "import ruleproxy; print(ruleproxy.__version__)")
          tag="v$version"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = "false" ]; then
              if ! bundle_asset_present=$(gh release view "$tag" --json assets --jq '[.assets[].name] | index("mxc-g-runtime-bundle.zip") != null'); then
                echo "::error title=Release::Could not inspect assets on existing $tag; refusing to modify the release."
                exit 1
              fi
              if [ "$bundle_asset_present" = "true" ]; then
                mkdir -p dist/existing-g-bundle
                if ! gh release download "$tag" --pattern mxc-g-runtime-bundle.zip --dir dist/existing-g-bundle; then
                  echo "::error title=Release::Could not download the existing G bundle asset from $tag; refusing to modify the release."
                  exit 1
                fi
                if python3 - <<'PY'
          from pathlib import Path
          import install_runtime
          files = list(Path('dist/existing-g-bundle').iterdir())
          if len(files) != 1:
              raise SystemExit('Expected exactly one existing G bundle release asset')
          install_runtime._g_bundle_bytes(files[0].resolve(strict=True), allow_env_cache=False)
          PY
                then
                  echo "::notice title=Release::$tag already contains the fixed G runtime bundle. Raise ruleproxy.__version__ to publish a new release."
                  exit 0
                fi
                echo "::error title=Release::Existing G bundle asset on $tag failed fixed digest validation; refusing to modify the release."
                exit 1
              fi
              gh release upload "$tag" dist/mxc-g-runtime-bundle.zip
              echo "::notice title=Release::Attached the verified G runtime bundle to existing $tag."
              exit 0
            fi
            gh release delete "$tag" --yes  # an unfinished draft from an interrupted run
          fi
          gh release create "$tag" dist/RuleProxy-Web-"$version"-windows-x64.zip dist/SHA256SUMS.txt dist/mxc-g-runtime-bundle.zip \
            --target "$GITHUB_SHA" --title "RuleProxy Web $version" --notes-file dist/release-notes.md
          echo "::notice title=Release::Published $tag"
