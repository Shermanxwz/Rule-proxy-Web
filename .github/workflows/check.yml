name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux · Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # The interpreter here is not the one apt serves, so this also covers the PyYAML fallback into vendor/.
      - name: One-step setup, as a user runs it
        run: sh setup-linux.sh
      - name: Tests, with the real network sandbox
        env:
          # Sandbox tests must run here, not skip.
          RULEPROXY_REQUIRE_ISOLATION: "1"
        run: python -B .github/run_tests.py
      - name: Start the panel with start-linux.sh and run the core
        run: python -B .github/smoke_panel.py sh start-linux.sh

  linux-system:
    name: Ubuntu ${{ matrix.ubuntu }} · system Python
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
    steps:
      - uses: actions/checkout@v5
      - name: Setup refuses to run as root
        run: |
          if sudo sh setup-linux.sh; then
            echo "::error title=Setup::setup-linux.sh ran as root"
            exit 1
          fi
      - name: One-step setup, as a user runs it
        run: sh setup-linux.sh
      - name: A second run finds everything in place
        run: sh setup-linux.sh --check && sh setup-linux.sh
      - name: Tests, with the real network sandbox
        env:
          RULEPROXY_REQUIRE_ISOLATION: "1"
        run: python3 -B .github/run_tests.py
      - name: Start the panel with start-linux.sh and run the core
        run: python3 -B .github/smoke_panel.py sh start-linux.sh

  windows:
    name: Windows · Python 3.13
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests, including real shell links
        run: python -B .github/run_tests.py
      - name: Start-Windows.cmd in a source checkout sets up once, then runs the panel and core
        run: python -B .github\smoke_panel.py "$env:GITHUB_WORKSPACE\Start-Windows.cmd"

  windows-package:
    name: Windows package · build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build the release package from pinned downloads
        run: python -B .github/build_windows_package.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: dist/
          if-no-files-found: error
          retention-days: 30

  windows-package-test:
    name: Windows package · test
    needs: windows-package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: windows-package
          path: dist
      - name: Unpack, as a user does, into a folder with Chinese characters and a space
        run: |
          $zip = Get-Item dist\RuleProxy-Web-*-windows-x64.zip
          $expected = ((Get-Content dist\SHA256SUMS.txt) -split '\s+')[0]
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw "The package does not match SHA256SUMS.txt" }
          $dest = Join-Path $env:RUNNER_TEMP '测试 目录'
          Expand-Archive $zip -DestinationPath $dest
          $package = Join-Path $dest 'RuleProxy-Web'
          $allowed = 'bin', 'examples', 'python', 'ruleproxy', 'vendor', 'web', 'LICENSE', 'README.md', 'Run-RuleProxy.py', 'Start-Windows.cmd', 'THIRD-PARTY.md'
          $unexpected = Get-ChildItem $package -Name | Where-Object { $_ -notin $allowed }
          if ($unexpected) { throw "Unexpected files in the package: $unexpected" }
          "PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # -X utf8: the path holds Chinese characters and this pipe is cp1252; the embedded Python ignores PYTHON* variables.
      - name: The package's Python runs on its own
        run: '& "$env:PACKAGE\python\python.exe" -X utf8 -c "import sys, ruleproxy, yaml; print(sys.version); print(sys.flags.isolated, sys.path); print(ruleproxy.__file__); print(yaml.__file__, yaml.__with_libyaml__)"'
      - name: Tests with the package's Python and code
        run: '& "$env:PACKAGE\python\python.exe" -B .github\run_tests.py --code "$env:PACKAGE"'
      - name: Start the panel with Start-Windows.cmd and run the bundled core
        run: '& "$env:PACKAGE\python\python.exe" -B .github\smoke_panel.py "$env:PACKAGE\Start-Windows.cmd"'

  release:
    name: Publish the release
    needs: [linux, linux-system, windows, windows-package-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: windows-package
          path: dist
      - name: Publish v<version> once; later pushes leave it alone until the version changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c "import ruleproxy; print(ruleproxy.__version__)")
          tag="v$version"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = "false" ]; then
              echo "::notice title=Release::$tag is already published. Raise ruleproxy.__version__ to publish a new release."
              exit 0
            fi
            gh release delete "$tag" --yes  # an unfinished draft from an interrupted run
          fi
          gh release create "$tag" dist/RuleProxy-Web-"$version"-windows-x64.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "RuleProxy Web $version" --notes-file dist/release-notes.md
          echo "::notice title=Release::Published $tag"
