name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux · Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # The interpreter here is not the one apt serves, so this also covers the PyYAML fallback into vendor/.
      - name: One-step setup, as a user runs it
        run: sh setup-linux.sh
      - name: Tests, with the real network sandbox
        env:
          # Sandbox tests must run here, not skip.
          RULEPROXY_REQUIRE_ISOLATION: "1"
        run: python -B .github/run_tests.py
      - name: Start the panel with start-linux.sh and run the core
        run: python -B .github/smoke_panel.py sh start-linux.sh

  linux-system:
    name: Ubuntu ${{ matrix.ubuntu }} · system Python
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
    steps:
      - uses: actions/checkout@v5
      - name: Setup refuses to run as root
        run: |
          if sudo sh setup-linux.sh; then
            echo "::error title=Setup::setup-linux.sh ran as root"
            exit 1
          fi
      - name: One-step setup, as a user runs it
        run: sh setup-linux.sh
      - name: A second run finds everything in place
        run: sh setup-linux.sh --check && sh setup-linux.sh
      - name: Tests, with the real network sandbox
        env:
          RULEPROXY_REQUIRE_ISOLATION: "1"
        run: python3 -B .github/run_tests.py
      - name: Start the panel with start-linux.sh and run the core
        run: python3 -B .github/smoke_panel.py sh start-linux.sh

  unit:
    name: Unit · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: All cross-platform unit tests
        env:
          RULEPROXY_REQUIRE_ELEVATED_STARTUP: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: python -B .github/run_tests.py
      - name: Parse PowerShell deployment scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(Get-ChildItem scripts -Filter '*.ps1' -File) + @(Get-ChildItem .github -Filter 'windows-proxifyre-vm-*.ps1' -File) + @(Get-Item -LiteralPath .github/windows-global-vm-run.ps1)
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Online bootstrap with embedded Python and no raw-host access
        if: runner.os == 'Windows' && matrix.python == '3.14'
        timeout-minutes: 10
        run: python -B .github/check_windows_online_bootstrap.py
