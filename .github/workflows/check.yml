name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux · Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # The interpreter here is not the one apt serves, so this also covers the PyYAML fallback into vendor/.
      - name: One-step setup, as a user runs it
        run: sh setup-linux.sh
      - name: Tests, with the real network sandbox
        env:
          # Sandbox tests must run here, not skip.
          RULEPROXY_REQUIRE_ISOLATION: "1"
        run: python -B .github/run_tests.py
      - name: Start the panel with start-linux.sh and run the core
        run: python -B .github/smoke_panel.py sh start-linux.sh

  linux-system:
    name: Ubuntu ${{ matrix.ubuntu }} · system Python
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
    steps:
      - uses: actions/checkout@v5
      - name: Setup refuses to run as root
        run: |
          if sudo sh setup-linux.sh; then
            echo "::error title=Setup::setup-linux.sh ran as root"
            exit 1
          fi
      - name: One-step setup, as a user runs it
        run: sh setup-linux.sh
      - name: A second run finds everything in place
        run: sh setup-linux.sh --check && sh setup-linux.sh
      - name: Tests, with the real network sandbox
        env:
          RULEPROXY_REQUIRE_ISOLATION: "1"
        run: python3 -B .github/run_tests.py
      - name: Start the panel with start-linux.sh and run the core
        run: python3 -B .github/smoke_panel.py sh start-linux.sh

  global-linux-native:
    name: Linux global capture · real kernel and pinned Mihomo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GLOBAL_PROOF_DIR: ${{ runner.temp }}/ruleproxy-linux-global-native
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Prepare evidence and native dependencies
        run: |
          mkdir -p "$GLOBAL_PROOF_DIR"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['GLOBAL_PROOF_DIR'], 'scope.json').write_text(json.dumps({
              'scope': 'two nested disposable network namespaces with namespace-inode checks',
              'requires_real_fixed_core': True,
              'requires_real_guard_and_policy_routes': True,
              'real_external_proxy_or_login': False,
              'interactive_polkit_dialog_tested': False,
          }, indent=2) + '\n')
          PY
          sudo apt-get update
          # Avoid upgrading an existing networking package and restarting its
          # service. The fixtures run all ip/nft mutations inside fresh netns.
          sudo apt-get install --yes --no-install-recommends --no-upgrade nftables iproute2 util-linux
          python3 -m pip install -r requirements.txt
      - name: Prepare and verify the pinned core
        run: python3 install_runtime.py --if-needed 2>&1 | tee "$GLOBAL_PROOF_DIR/runtime-preparation.log"
      - name: Real independent guard and actual TUN core acceptance
        run: |
          global_python="$(command -v python3)"
          set +e
          sudo env RULEPROXY_REQUIRE_GLOBAL_NETNS=1 RULEPROXY_REQUIRE_GLOBAL_CORE_NETNS=1 \
            "$global_python" -B -m unittest discover -v -s tests -p 'test_linux_global*_netns.py' \
            2>&1 | tee "$GLOBAL_PROOF_DIR/native-tests.log"
          native_status=${PIPESTATUS[0]}
          set -e
          NATIVE_STATUS="$native_status" python3 - <<'PY'
          import hashlib, json, os, re, sys
          from pathlib import Path
          proof = Path(os.environ['GLOBAL_PROOF_DIR'])
          log = (proof / 'native-tests.log').read_text(encoding='utf-8', errors='replace')
          match = re.search(r'Ran (\d+) tests? in ', log)
          count = int(match.group(1)) if match else 0
          native_status = int(os.environ['NATIVE_STATUS'])
          passed = native_status == 0 and count == 2 and 'skipped' not in log.lower()
          core = Path('bin/linux-amd64/mihomo')
          summary = {
              'status': 'passed' if passed else 'failed',
              'unittest_exit_code': native_status,
              'expected_native_tests': 2,
              'native_tests_run': count,
              'no_skips': 'skipped' not in log.lower(),
              'python': sys.version.split()[0],
              'mihomo_sha256': hashlib.sha256(core.read_bytes()).hexdigest(),
              'polkit_dialog_exercised': False,
          }
          (proof / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary))
          if not passed:
              print('::error title=Linux global native acceptance::Both isolated native tests must pass without skips.')
              raise SystemExit(native_status or 1)
          PY
      - name: Keep native acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-global-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.GLOBAL_PROOF_DIR }}
          if-no-files-found: error
          retention-days: 14

  unit:
    name: Unit · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: All cross-platform unit tests
        env:
          RULEPROXY_REQUIRE_ELEVATED_STARTUP: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: python -B .github/run_tests.py
      - name: Parse PowerShell deployment scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(Get-ChildItem scripts -Filter '*.ps1' -File) + @(Get-ChildItem .github -Filter 'windows-proxifyre-vm-*.ps1' -File)
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Online bootstrap with embedded Python and no raw-host access
        if: runner.os == 'Windows' && matrix.python == '3.14'
        timeout-minutes: 10
        run: python -B .github/check_windows_online_bootstrap.py
