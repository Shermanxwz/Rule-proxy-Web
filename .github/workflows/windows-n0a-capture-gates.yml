name: N0a private capture mechanism gates (no Windows guest)
on:
  push:
    branches: [dot/windows-isolation-proof]
    paths:
      - '.github/windows_n0a_capture.py'
      - '.github/test_windows_n0a_capture_qemu.py'
      - '.github/workflows/windows-n0a-capture-gates.yml'
      - 'tests/test_windows_client_n0a_capture.py'
      - 'tests/test_windows_n0a_capture_qemu.py'
      - 'tests/test_windows_n0a_capture_workflow.py'
permissions:
  contents: read
concurrency:
  group: n0a-capture-gates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture-mechanism:
    if: ${{ github.ref == 'refs/heads/dot/windows-isolation-proof' && github.event_name == 'push' && contains(github.event.head_commit.message, '[n0a-capture-gates]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Required bounded sink and synthetic producer unit gates
        timeout-minutes: 2
        run: |
          python3 -B -c "import pathlib,unittest; names=('test_windows_client_n0a_capture.py','test_windows_n0a_capture_qemu.py','test_windows_n0a_capture_workflow.py'); assert all((pathlib.Path('tests')/n).is_file() for n in names); parts=[unittest.defaultTestLoader.discover('tests',pattern=n) for n in names]; assert all(p.countTestCases()>0 for p in parts); result=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(parts)); raise SystemExit(not result.wasSuccessful() or bool(result.skipped))"
      - name: Install official packaged QEMU for the synthetic lifecycle gate
        timeout-minutes: 3
        run: |
          sudo timeout 90 apt-get update -qq
          sudo timeout 90 apt-get install -y --no-install-recommends --no-remove qemu-system-x86
      - name: Actual QEMU 8.2.2 FIFO and owned exit lifecycle, not Windows isolation
        timeout-minutes: 2
        run: python3 -B .github/test_windows_n0a_capture_qemu.py --run-actual-qemu
# No artifact upload: PCAP and raw diagnostics remain private and owned-cleaned.
