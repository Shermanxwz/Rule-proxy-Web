name: Windows online setup release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag with a matching draft GitHub Release
        type: string
        required: true
        default: v0.4.1
      release_id:
        description: Numeric ID of the existing draft release
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: windows-online-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  upload-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - name: Validate the version tag
        run: |
          python3 - <<'PY'
          import os, re
          if re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-rc\.[0-9]+)?', os.environ['RELEASE_TAG']) is None:
              raise SystemExit('A versioned stable or release-candidate tag is required')
          if re.fullmatch(r'[1-9][0-9]*', os.environ['RELEASE_ID']) is None:
              raise SystemExit('A numeric draft release ID is required')
          PY
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Verify that the draft release belongs to this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from ruleproxy import __version__
          repo, tag = os.environ['GITHUB_REPOSITORY'], os.environ['RELEASE_TAG']
          release_id = os.environ['RELEASE_ID']
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/{release_id}']))
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          prerelease = '-rc.' in tag
          if (str(release['id']) != release_id or release['tag_name'] != tag or release['draft'] is not True
                  or release['prerelease'] != prerelease or release['target_commitish'] != commit
                  or tag.removeprefix('v').split('-rc.', 1)[0] != __version__):
              raise SystemExit('Only the matching versioned draft release can receive these assets')
          print('Draft release, version and checked-out commit match')
          PY
      - name: Build the Windows online setup source package
        run: python -B .github/build_windows_online_package.py windows-online-release
      - name: Verify the release asset against the archived package identity
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          record_path = Path(f'verification/releases/online-release-{os.environ["RELEASE_TAG"]}.json')
          if not record_path.is_file():
              record_path = Path(f'verification/windows-2026-10-16/online-release-{os.environ["RELEASE_TAG"]}.json')
          record = json.loads(record_path.read_text())
          expected = record['online_zip']
          package = Path('windows-online-release') / expected['name']
          data = package.read_bytes()
          if len(data) != expected['bytes'] or hashlib.sha256(data).hexdigest() != expected['sha256']:
              raise SystemExit('Built release asset does not match the reviewed package')
          sums = (Path('windows-online-release') / 'SHA256SUMS.txt').read_text()
          if sums != f'{expected["sha256"]}  {expected["name"]}\n':
              raise SystemExit('Checksum manifest does not match the reviewed package')
          print('Release ZIP and checksum manifest match the archived identity')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: windows-online-release-${{ inputs.tag }}
          path: windows-online-release/
          if-no-files-found: error
          retention-days: 7
      - name: Upload assets to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" windows-online-release/*.zip windows-online-release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY"
