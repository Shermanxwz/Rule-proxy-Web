    branches: [dot/windows-isolation-proof]
    paths:
      - '.github/windows_identity_direct_stage0.py'
      - '.github/windows_n0a_control.py'
      - '.github/windows_n0a_udp.py'
      - '.github/windows_n0a_udp_guest.py'
