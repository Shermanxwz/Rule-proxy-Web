  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    # Keep the exact experimental branch and explicit runtime intent checks.
    if: ${{ true && github.ref == 'refs/heads/dot/windows-isolation-proof' && github.event_name == 'push' && (contains(github.event.head_commit.message, '[identity-direct-stage0-runtime]') || contains(github.event.head_commit.message, '[identity-direct-stage0-gates]') || contains(github.event.head_commit.message, '[n0a-connect-runtime]') || contains(github.event.head_commit.message, '[n0a-capture-runtime]') || contains(github.event.head_commit.message, '[n0a-udp-runtime]') || contains(github.event.head_commit.message, '[n0a-udp-parent-runtime]') || contains(github.event.head_commit.message, '[n0a-udp6-runtime]')) }}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Parse only the new guest PowerShell entrypoints
        shell: powershell
        run: |
          foreach ($name in @('stage0-setup', 'stage0-run')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD ".github/windows-identity-direct-$name.ps1"),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw 'Stage0 guest syntax gate failed' }
          }
      - name: Execute mocked guest boundary regressions, not VM acceptance
        shell: powershell
        run: ./.github/test-windows-identity-direct-gates.ps1
      - name: Compile the pinned zero-network native actor, never execute it here
        shell: pwsh
        run: |
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs=& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Installed MSVC not found' }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          ./.github/build_windows_identity_actor.ps1 -IdentityOnly -OutputDirectory "$PWD\client-stage0-actor" -ExpectedSourceSha256 530482aae4c94707ae4da25c1c3e84d8da929a021fc23b09e59fec17fe28d553
          $manifest=Get-Content -Raw client-stage0-actor/build-manifest.json | ConvertFrom-Json
          if ($manifest.httpCompiled -or -not $manifest.staticCrt) { throw 'Zero-network static actor required' }
          [IO.File]::WriteAllText("$PWD\client-stage0-actor/actor-sha256.txt",$manifest.executableSha256)
      - name: Source-token actor projection negative control, not isolation acceptance
        timeout-minutes: 1
        shell: pwsh
        run: |
          $digest=(Get-Content -Raw client-stage0-actor/actor-sha256.txt).Trim().ToLowerInvariant()
          python -B .github/test_windows_identity_actor_projection.py --run-source-token-control --actor "$PWD/client-stage0-actor/windows_identity_actor.exe" --actor-sha256 $digest
          if ($LASTEXITCODE -ne 0) { throw 'Source-token actor projection control failed' }
      - name: Pure unit tests, not Windows runtime acceptance
        run: |
          python -B -m unittest discover -s tests -p "test_windows_client_stock_stage0.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in @('test_windows_client_direct_stage0.py', 'test_windows_client_direct_guest.py', 'test_windows_client_direct_workflow.py', 'test_windows_client_direct_actor_projection.py')) {
            if (-not (Test-Path -LiteralPath (Join-Path 'tests' $file) -PathType Leaf)) { throw 'Required direct tests missing' }
          }
          python -B -c "import unittest; s=unittest.defaultTestLoader.discover('tests', pattern='test_windows_client_direct*.py'); assert s.countTestCases() >= 7, 'Direct test discovery incomplete'; r=unittest.TextTestRunner(verbosity=2).run(s); raise SystemExit(not r.wasSuccessful())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build production-only N0a actor for a future explicit opt-in
