name: Windows AppContainer isolation lab

on:
  push:
    branches:
      - 'claude/windows-appcontainer-*'
      - 'codex/windows-finish-*'
    paths:
      - '.github/windows_appcontainer_lab.py'
      - '.github/windows_appcontainer_product.py'
      - '.github/windows_appcontainer_compat.py'
      - '.github/workflows/windows-appcontainer-lab.yml'
      - 'ruleproxy/windows_appcontainer.py'
      - 'ruleproxy/windows_app_process.py'
      - 'ruleproxy/windows_global_guard.py'
  pull_request:
    paths:
      - '.github/windows_appcontainer_lab.py'
      - '.github/windows_appcontainer_product.py'
      - '.github/windows_appcontainer_compat.py'
      - '.github/workflows/windows-appcontainer-lab.yml'
      - 'ruleproxy/windows_appcontainer.py'
      - 'ruleproxy/windows_app_process.py'
      - 'ruleproxy/windows_global_guard.py'
  workflow_dispatch:
    inputs:
      browser_compat:
        description: 'Repeat the completed browser compatibility experiment'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lab:
    name: AppContainer confinement · disposable Server 2025
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64
      - run: python -m pip install -r requirements.txt
      - name: Run bounded AppContainer lab
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B .github/windows_appcontainer_lab.py --work 'C:\RuleProxyAppContainerLab'
          if ($LASTEXITCODE -ne 0) { throw 'AppContainer lab gates failed; inspect report artifact' }
      - name: Run shipped AppContainer code end to end
        if: success() || failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B .github/windows_appcontainer_product.py --work 'C:\RuleProxyAppContainerProduct'
          if ($LASTEXITCODE -ne 0) { throw 'AppContainer product gates failed; inspect report artifact' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-appcontainer-lab
          path: |
            C:\RuleProxyAppContainerLab\report.json
            C:\RuleProxyAppContainerLab\*.log
            C:\RuleProxyAppContainerProduct\product-report.json
          if-no-files-found: warn

  compat:
    if: github.event_name == 'workflow_dispatch' && inputs.browser_compat
    name: AppContainer app compatibility · disposable Server 2025
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64
      - run: python -m pip install -r requirements.txt
      - name: Run bounded browser sandbox compatibility matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'utf-8'
          python -B .github/windows_appcontainer_compat.py --work 'C:\RuleProxyAppContainerCompat'
          if ($LASTEXITCODE -ne 0) { throw 'Browser fixture, control or cleanup failed; inspect report' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-appcontainer-compat
          path: |
            C:\RuleProxyAppContainerCompat\compat-report.json
          if-no-files-found: warn
