name: Bounded stock Stage0 APT plan diagnostic
on:
  push:
    branches: [dot/windows-isolation-proof]
    paths:
      - '.github/windows_identity_apt_diagnostic.py'
      - '.github/workflows/windows-identity-apt-diagnostic.yml'
      - 'tests/test_windows_client_apt_diagnostic.py'
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.ref == 'refs/heads/dot/windows-isolation-proof' && github.event_name == 'push' && contains(github.event.head_commit.message, '[identity-win11-apt-diagnostic-01]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Establish one absolute diagnostic deadline and closed placeholders
        timeout-minutes: 1
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import json, os, pathlib, time
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'identity-apt-diagnostic-01'
          output.mkdir()
          for phase in ('before_refresh', 'after_refresh'):
              (output / (phase + '.json')).write_text(json.dumps({
                  'schema_version': 1, 'phase': phase, 'status': 'not_started',
                  'stop_reason': 'workflow_preflight', 'raw_output_exported': False,
                  'packages_installed': False, 'recovery_attempted': False, 'vm_created': False,
                  'acceptance_policy_changed': False}) + '\n', encoding='ascii')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='ascii') as stream:
              stream.write('APT_DIAGNOSTIC_DEADLINE=' + str(int(time.time()) + 480) + '\n')
          PY
      - uses: actions/checkout@v5
        timeout-minutes: 1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Pure diagnostic regressions only
        timeout-minutes: 1
        run: /usr/bin/python3 -I -B -m unittest discover -s tests -p 'test_windows_client_apt_diagnostic.py' -v
      - name: Observe the frozen APT gate before and after the same index refresh
        timeout-minutes: 8
        run: |
          /usr/bin/python3 -I -B .github/windows_identity_apt_diagnostic.py \
            --output-dir "$RUNNER_TEMP/identity-apt-diagnostic-01" \
            --deadline-epoch "$APT_DIAGNOSTIC_DEADLINE"
      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 1
        with:
          name: identity-apt-diagnostic-01-public
          path: |
            ${{ runner.temp }}/identity-apt-diagnostic-01/before_refresh.json
            ${{ runner.temp }}/identity-apt-diagnostic-01/after_refresh.json
          retention-days: 7
          if-no-files-found: error
