name: Windows profile directory context control

on:
  push:
    branches:
      - 'codex/windows-profile-env-*'
    paths:
      - '.github/windows_profile_context_control.py'
      - '.github/workflows/windows-profile-context-control.yml'

permissions:
  contents: read

jobs:
  context:
    name: ${{ matrix.os }} · outside profile directory control
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Compare profile layouts in fresh processes outside containment
        run: python -B .github/windows_profile_context_control.py --report windows-profile-context-control.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-profile-context-control-${{ matrix.os }}
          path: windows-profile-context-control.json
          if-no-files-found: error
          retention-days: 7
