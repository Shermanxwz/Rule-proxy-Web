name: PSEC capability diagnostic

on:
  workflow_dispatch:
    inputs:
      identity_proof_compile_only:
        description: Compile the isolated identity proof actor only; no sandbox or network tests
        required: false
        type: boolean
        default: false
      diagnostic_internal_tcp_policy:
        description: Build source-only G3 internal TCP policy controls; never product acceptance
        required: false
        type: boolean
        default: false
  push:
    branches:
      - 'codex/windows-capability-*'
    paths:
      - '.github/build_mxc_capability_probe.py'
      - '.github/windows_network_experiment.py'
      - '.github/windows_native_dns_probe.py'
      - '.github/windows_dns_session.py'
      - '.github/workflows/mxc-capability.yml'

permissions:
  contents: read

concurrency:
  group: psec-capability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-mxc-g-bundle:
    if: (github.event_name != 'workflow_dispatch' || !inputs.identity_proof_compile_only) && (github.event_name != 'workflow_dispatch' || !inputs.diagnostic_internal_tcp_policy)
    name: Verify fixed G artifact and assemble deterministic bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Prefer the published fixed G release asset
        id: g-release-asset
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import install_runtime

          output = Path('mxc-g-bundle.zip')
          try:
              data = install_runtime.fetch_g_bundle_release()
          except install_runtime.GBundleNotPublished:
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
                  stream.write('bootstrap_fallback=true\n')
              print('The v0.2.2 bundle asset is not published yet; using the fixed bootstrap artifact.')
          else:
              output.write_bytes(data)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
                  stream.write('bootstrap_fallback=false\n')
              print(f'Verified published G bundle SHA-256 {install_runtime.MXC_G_BUNDLE_SHA256}')
          PY
      - name: Download the fixed successful G build artifact for bootstrap
        if: steps.g-release-asset.outputs.bootstrap_fallback == 'true'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 11938733475
          run-id: 38660663692
          github-token: ${{ github.token }}
          repository: Shermanxwz/Rule-proxy-Web
          path: g-source-download
          skip-decompress: true
          digest-mismatch: error
      - name: Verify the artifact ZIP and assemble the pinned G bundle
        if: steps.g-release-asset.outputs.bootstrap_fallback == 'true'
        run: |
          python -B - <<'PY'
          import hashlib
          import json
          from pathlib import Path, PurePosixPath
          import stat
          import zipfile
          import install_runtime

          downloads = [path for path in Path('g-source-download').iterdir() if path.is_file()]
          if len(downloads) != 1:
              raise SystemExit('Expected one raw artifact archive')
          archive_path = downloads[0]
          if hashlib.sha256(archive_path.read_bytes()).hexdigest() != '8a771727002d5f6f03ff00f5e26f99340fbbd17383dc7405ba99f7dd3388f036':
              raise SystemExit('Fixed G build artifact ZIP digest mismatch')
          required = {'build-manifest.json', 'wxc-exec.exe', 'MXC-LICENSE.md'}
          source = Path('g-source')
          source.mkdir()
          with zipfile.ZipFile(archive_path) as artifact:
              selected = {}
              for info in artifact.infolist():
                  name = PurePosixPath(info.filename)
                  if name.is_absolute() or '..' in name.parts or ':' in info.filename or '\\' in info.filename:
                      raise SystemExit('Unsafe member in pinned G build artifact')
                  if info.is_dir():
                      continue
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit('Symlink in pinned G build artifact')
                  leaf = name.name
                  if leaf in required:
                      if leaf in selected:
                          raise SystemExit('Duplicate fixed G build artifact member')
                      selected[leaf] = info
              if set(selected) != required:
                  raise SystemExit('Pinned G build artifact is missing required members')
              for leaf, info in selected.items():
                  (source / leaf).write_bytes(artifact.read(info))

          bundle = Path('mxc-g-bundle.zip')
          digest = install_runtime.build_g_bundle(source, bundle)
          if digest != install_runtime.MXC_G_BUNDLE_SHA256:
              raise SystemExit('Deterministic G bundle SHA-256 mismatch')
          extracted = Path('verified-g-bundle')
          extracted.mkdir()
          install_runtime._extract_g_bundle(bundle.read_bytes(), extracted)
          if hashlib.sha256((extracted / 'wxc-exec.exe').read_bytes()).hexdigest() != install_runtime.MXC_G_EXECUTOR_SHA256:
              raise SystemExit('Bundled G executor SHA-256 mismatch')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: fixed-mxc-g-bundle
          path: mxc-g-bundle.zip
          if-no-files-found: error
          retention-days: 7


  executor:
    if: github.event_name != 'workflow_dispatch' || !inputs.identity_proof_compile_only
    name: Build the fixed MXC source with one diagnostic capability change
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: microsoft/mxc
          ref: 7bf210247986cb73b1b314df60c2f1109c479c0b
          path: mxc-source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Use the fixed upstream Rust toolchain
        run: |
          rustup toolchain install 1.93 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build only the diagnostic native executor
        shell: pwsh
        run: |
          $arguments = @('--source', 'mxc-source', '--output', 'mxc-capability')
          if ('${{ inputs.diagnostic_internal_tcp_policy }}' -eq 'true') { $arguments += '--diagnostic-internal-tcp-policy' }
          python -X utf8 -B .github\build_mxc_capability_probe.py @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'workflow_dispatch' || !inputs.diagnostic_internal_tcp_policy
        with:
          name: mxc-capability-executor
          path: mxc-capability/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_internal_tcp_policy
        with:
          name: mxc-internal-tcp-policy-executor
          path: mxc-capability/
          if-no-files-found: error
          retention-days: 14

  arm-observation:
    name: Observe proxy sockets and native DNS with the diagnostic PSEC executor
    needs: [executor, pinned-mxc-g-bundle]
    if: github.event_name != 'workflow_dispatch' || !inputs.diagnostic_internal_tcp_policy
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          name: mxc-capability-executor
          path: mxc-capability
      - uses: actions/download-artifact@v8
        with:
          name: fixed-mxc-g-bundle
          path: fixed-mxc-g-bundle
      - name: Prepare an independent package with its original verified runtimes
        run: |
          python -X utf8 -B .github\build_windows_package.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checksums = @(Get-Content -LiteralPath dist\SHA256SUMS.txt | Where-Object { $_.Trim() })
          if ($checksums.Count -ne 1 -or $checksums[0] -notmatch '^([a-f0-9]{64})  (RuleProxy-Web-[A-Za-z0-9._-]+-windows-x64-personal\.zip)$') { throw 'Invalid package checksum inventory' }
          $expected, $filename = $Matches[1], $Matches[2]
          $zip = Get-Item -LiteralPath (Join-Path dist $filename) -ErrorAction Stop
          if ((Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Package checksum mismatch' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath "$env:RUNNER_TEMP\ruleproxy-capability"
          # The product ZIP uses ProxiFyre; this MXC experiment needs its own
          # fixed legacy runtime. Change only this disposable extracted copy.
          $env:RULEPROXY_DIAGNOSTIC_ROOT = "$env:RUNNER_TEMP\ruleproxy-capability\RuleProxy-Web"
          python -X utf8 -B -c "import os, install_runtime; from pathlib import Path; install_runtime.install('windows-amd64', root=Path(os.environ['RULEPROXY_DIAGNOSTIC_ROOT']), mxc_variant='g-patched', g_bundle_path=Path('fixed-mxc-g-bundle/mxc-g-bundle.zip'), variant_explicit=True, allow_env_bundle_cache=False)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect actual contained sockets and native DNS APIs
        run: |
          $root = "$env:RUNNER_TEMP\ruleproxy-capability\RuleProxy-Web"
          $executor = (Get-Item mxc-capability\wxc-exec.exe).FullName
          $manifest = (Get-Item mxc-capability\build-manifest.json).FullName
          & "$root\python\python.exe" -X utf8 -B .github\windows_network_experiment.py --root "$root" --allow-emulated-x64 --collect-native-dns --test-psec-executor "$executor" --test-psec-manifest "$manifest" --report windows-capability-observations.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: windows-capability-observations
          path: windows-capability-observations.json
          if-no-files-found: error
          retention-days: 14

  identity-proof-compile:
    if: github.event_name == 'workflow_dispatch' && inputs.identity_proof_compile_only
    name: Compile native identity proof only
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Load installed MSVC and compile without executing the actor
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Installed MSVC toolchain not found' }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          ./.github/build_windows_identity_actor.ps1 -OutputDirectory "$PWD\identity-actor-build"
      - name: Pure Python identity proof unit tests only
        run: python -B -m unittest discover -s tests -p "test_windows_identity*.py" -v
      - uses: actions/upload-artifact@v7
        with:
          name: identity-actor-compile-only
          path: |
            identity-actor-build/windows_identity_actor.exe
            identity-actor-build/build-manifest.json
          if-no-files-found: error
          retention-days: 7

