      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Admit exactly one exclusive pipe-gate marker
        shell: pwsh
        env:
          GATE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python -I -S -B -c "import os,json; m=os.environ['GATE_MESSAGE']; assert m.count('[identity-proxy-pipe-gates]')==1 and not any(x in m for x in json.loads(os.environ['EXCLUDED_MARKERS'])), 'marker_admission'"
          if ($LASTEXITCODE -ne 0) { throw 'marker_admission' }
      - name: Verify pins and required pure bridge and pipe suites
        shell: pwsh
        run: |
          $program=@'
          import hashlib,json,os,pathlib,unittest
          pins=json.loads(os.environ['SOURCE_PINS'])
          for name,digest in pins.items():
           p=pathlib.Path(name)
           assert p.is_file() and not p.is_symlink() and hashlib.sha256(p.read_bytes()).hexdigest()==digest,'source_pin'
          names=('test_windows_identity_proxy_bridge_codec.py','test_windows_identity_proxy_bridge_model.py','test_windows_identity_proxy_bridge_native.py','test_windows_identity_proxy_pipe_probe.py')
          suites=[unittest.defaultTestLoader.discover('tests',pattern=name) for name in names]
          counts=[suite.countTestCases() for suite in suites]
          assert all(counts) and sum(counts[:3])==63,'required_tests'
          result=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(suites))
          print('REQUIRED',sum(counts),'SKIPS',len(result.skipped),'OK',result.wasSuccessful())
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)
          '@
          python -I -S -B -c $program
          if ($LASTEXITCODE -ne 0) { throw 'required_pure_tests' }
      - name: Parse and compile pipe actor without execution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD '.github/build_windows_identity_proxy_pipe_actor.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { throw 'build_syntax' }
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs=& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'installed_msvc_unavailable' }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $pins=$env:SOURCE_PINS|ConvertFrom-Json
          & ./.github/build_windows_identity_proxy_pipe_actor.ps1 -OutputDirectory "$PWD/proxy-pipe-build" -ExpectedActorSha256 $pins.'.github/native/windows_identity_proxy_pipe_actor.cpp' -ExpectedIdentitySha256 $pins.'.github/native/windows_identity_actor.cpp' -ExpectedCoreSha256 $pins.'.github/native/windows_identity_proxy_bridge_core.hpp'
          if ($LASTEXITCODE -ne 0) { throw 'pipe_compile' }
      - name: Explicit bounded hosted pipe suite once
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $manifestSha=(Get-FileHash -LiteralPath 'proxy-pipe-build/identity-proxy-pipe-manifest.json' -Algorithm SHA256).Hash.ToLowerInvariant()
          $actor=(Resolve-Path -LiteralPath 'proxy-pipe-build/windows_identity_proxy_pipe_actor.exe').Path
          $manifest=(Resolve-Path -LiteralPath 'proxy-pipe-build/identity-proxy-pipe-manifest.json').Path
          $tempProgram=@'
          import os,pathlib
          try:
           root=pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
           if not root.is_dir():raise ValueError('temp_parent')
           print(str(root))
          except BaseException:raise SystemExit('temp_parent') from None
          '@
          $tempParent=& python -I -S -B -c $tempProgram
          if ($LASTEXITCODE -ne 0 -or $tempParent -isnot [string] -or [string]::IsNullOrWhiteSpace($tempParent)) { throw 'temp_parent' }
          $work=Join-Path $tempParent ('identity-proxy-pipe-'+[Guid]::NewGuid().ToString('N'))
          python -I -S -B tests/test_windows_identity_proxy_pipe_probe.py --run-hosted --actor $actor --manifest $manifest --expected-manifest-sha256 $manifestSha --work $work
          if ($LASTEXITCODE -ne 0) { throw 'hosted_pipe_mechanics' }
