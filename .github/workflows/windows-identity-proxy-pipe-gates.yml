          fetch-depth: 1
      - name: Admit exactly one exclusive pipe-gate marker
        shell: bash
        env:
          GATE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 -I -S -B -c "import os,json; m=os.environ['GATE_MESSAGE']; assert m.count('[identity-proxy-pipe-gates]')==1 and not any(x in m for x in json.loads(os.environ['EXCLUDED_MARKERS'])), 'marker_admission'"
      - name: Verify pins and required pure bridge and pipe suites
        shell: bash
        run: |
          python3 -I -S -B - <<'PY'
          import hashlib,json,os,pathlib,unittest
          pins=json.loads(os.environ['SOURCE_PINS'])
          for name,digest in pins.items():
           p=pathlib.Path(name)
           assert p.is_file() and not p.is_symlink() and hashlib.sha256(p.read_bytes()).hexdigest()==digest,'source_pin'
          names=('test_windows_identity_proxy_bridge_codec.py','test_windows_identity_proxy_bridge_model.py','test_windows_identity_proxy_bridge_native.py','test_windows_identity_proxy_pipe_probe.py')
          suites=[unittest.defaultTestLoader.discover('tests',pattern=name) for name in names]
          counts=[suite.countTestCases() for suite in suites]
          assert all(counts) and sum(counts[:3])==63,'required_tests'
          result=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(suites))
          print('REQUIRED',sum(counts),'SKIPS',len(result.skipped),'OK',result.wasSuccessful())
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
  windows:
    if: ${{ github.ref == 'refs/heads/dot/windows-isolation-proof' && github.event_name == 'push' && contains(github.event.head_commit.message, '[identity-proxy-pipe-gates]') && !contains(github.event.head_commit.message, '[identity-direct-evidence-01]') && !contains(github.event.head_commit.message, '[identity-direct-stage0-gates]') && !contains(github.event.head_commit.message, '[identity-direct-stage0-runtime]') && !contains(github.event.head_commit.message, '[identity-pipe-runtime]') && !contains(github.event.head_commit.message, '[identity-proxy-core-gates]') && !contains(github.event.head_commit.message, '[identity-restricted-r0-runtime]') && !contains(github.event.head_commit.message, '[identity-serviced-stage0-gates]') && !contains(github.event.head_commit.message, '[identity-serviced-stage0-runtime]') && !contains(github.event.head_commit.message, '[identity-stage0b-runtime]') && !contains(github.event.head_commit.message, '[identity-startup-paired-runtime]') && !contains(github.event.head_commit.message, '[identity-stock-stage0-runtime]') && !contains(github.event.head_commit.message, '[identity-win11-apt-diagnostic-02]') && !contains(github.event.head_commit.message, '[identity-win11-cache-inventory]') && !contains(github.event.head_commit.message, '[identity-win11-mode-inventory]') && !contains(github.event.head_commit.message, '[identity-win11-preflight]') && !contains(github.event.head_commit.message, '[identity-win11-stage0-runtime]') && !contains(github.event.head_commit.message, '[n0a-capture-gates]') && !contains(github.event.head_commit.message, '[n0a-capture-runtime]') && !contains(github.event.head_commit.message, '[n0a-connect-gates]') && !contains(github.event.head_commit.message, '[n0a-connect-runtime]') && !contains(github.event.head_commit.message, '[n0a-udp-gates]') && !contains(github.event.head_commit.message, '[n0a-udp-parent-gates]') && !contains(github.event.head_commit.message, '[n0a-udp-parent-runtime]') && !contains(github.event.head_commit.message, '[n0a-udp-runtime]') && !contains(github.event.head_commit.message, '[n0a-udp6-gates]') && !contains(github.event.head_commit.message, '[n0a-udp6-runtime]') }}
    runs-on: windows-2025
