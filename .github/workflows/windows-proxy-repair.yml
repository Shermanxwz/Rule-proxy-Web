name: Windows proxy repair qualification

on:
  push:
    branches: [codex/windows-proxy-repair-*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-proxy-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Build pinned Microsoft MXC proxy compatibility revision
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: microsoft/mxc
          ref: c6f301d53a1430c4c921a05c57af838f7392348f
          path: upstream-mxc
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Use upstream's pinned toolchain and public dependency mirror
        shell: pwsh
        run: |
          rustup toolchain install 1.93 --profile minimal
          rustup target add x86_64-pc-windows-msvc --toolchain 1.93
          Get-Content upstream-mxc/.azure-pipelines/.cargo/config.public.toml | Add-Content upstream-mxc/.cargo/config.toml
      - name: Build only the ProcessContainer executor and WinHTTP shim
        working-directory: upstream-mxc/src
        run: cargo +1.93 build --locked --release --target x86_64-pc-windows-msvc -p wxc -p wxc_winhttp_proxy_shim
      - name: Record source and binary integrity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force qualified-runtime
          Copy-Item upstream-mxc/src/target/x86_64-pc-windows-msvc/release/wxc-exec.exe qualified-runtime/
          Copy-Item upstream-mxc/src/target/x86_64-pc-windows-msvc/release/winhttp-proxy-shim.exe qualified-runtime/
          Copy-Item upstream-mxc/LICENSE.md qualified-runtime/MXC-LICENSE.md
          'microsoft/mxc c6f301d53a1430c4c921a05c57af838f7392348f; Rust 1.93; Cargo.lock; x86_64-pc-windows-msvc; no optional backends' | Set-Content qualified-runtime/SOURCE.txt
          Get-FileHash qualified-runtime/*.exe -Algorithm SHA256 | Format-List | Out-File qualified-runtime/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: mxc-proxy-runtime-x64
          path: qualified-runtime/
          if-no-files-found: error
          retention-days: 30

  native:
    needs: runtime
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: x64
          - runner: windows-11-arm
            architecture: x64
          - runner: windows-11-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - run: python -B install_runtime.py --platform windows-amd64 --if-needed
      - uses: actions/download-artifact@v8
        with:
          name: mxc-proxy-runtime-x64
          path: bin/windows-amd64
      - name: Test upstream proxy transport and the shipped launch path
        run: python -B .github/windows_native_validation.py --output native-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repair-${{ matrix.runner }}-${{ matrix.architecture }}
          path: native-results/
          if-no-files-found: error
          retention-days: 30
