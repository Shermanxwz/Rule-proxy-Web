name: Windows proxy repair qualification

on:
  push:
    branches: [codex/windows-proxy-repair-*]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-proxy-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Reuse the immutable qualification build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mxc-proxy-runtime-x64
          run-id: 38134137607
          github-token: ${{ github.token }}
          path: qualified-runtime
      - uses: actions/upload-artifact@v7
        with:
          name: mxc-proxy-runtime-x64
          path: qualified-runtime/
          if-no-files-found: error
          retention-days: 30

  native:
    needs: runtime
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: x64
          - runner: windows-11-arm
            architecture: x64
          - runner: windows-11-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - run: python -B install_runtime.py --platform windows-amd64 --if-needed
      - uses: actions/download-artifact@v8
        with:
          name: mxc-proxy-runtime-x64
          path: bin/windows-amd64
      - name: Test upstream proxy transport and the shipped launch path
        run: python -B .github/windows_native_validation.py --output native-results
      - name: Real failure rejection, descendant teardown, and core/wrapper crashes
        run: python -B .github/windows_fault_validation.py --output native-results
      - name: Real Edge rendering and cookie persistence
        run: python -B .github/windows_browser_validation.py --output native-results
      - name: Prepare official Chrome for Testing as an independent browser
        if: always() && matrix.runner == 'windows-11-arm' && matrix.architecture == 'arm64'
        run: |
          $url = 'https://storage.googleapis.com/chrome-for-testing-public/155.0.8059.39/win64/chrome-win64.zip'
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP/chrome.zip"
          Get-FileHash "$env:RUNNER_TEMP/chrome.zip" -Algorithm SHA256
          Expand-Archive "$env:RUNNER_TEMP/chrome.zip" -DestinationPath C:/RuleProxyChrome
          'RULEPROXY_TEST_BROWSER=C:/RuleProxyChrome/chrome-win64/chrome.exe' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Qualify independent Chrome browser
        if: always() && matrix.runner == 'windows-11-arm' && matrix.architecture == 'arm64'
        run: python -B .github/windows_browser_validation.py --output native-results/chrome
      - name: Diagnose browser compatibility without changing the network policy
        if: always() && matrix.runner == 'windows-11-arm' && matrix.architecture == 'arm64'
        run: python -B .github/windows_browser_experiments.py
      - name: Standard user application and browser acceptance
        if: always() && matrix.runner == 'windows-11-arm' && matrix.architecture == 'arm64'
        run: .github/run_windows_standard_user.ps1 -OutputDirectory native-results/standard-user
      - name: Prepare official Firefox as an independent adapter
        if: always() && matrix.runner == 'windows-11-arm' && matrix.architecture == 'arm64'
        run: |
          $url = 'https://archive.mozilla.org/pub/firefox/releases/157.0.1/win64/en-US/Firefox%20Setup%20157.0.1.exe'
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP/firefox.exe"
          Get-FileHash "$env:RUNNER_TEMP/firefox.exe" -Algorithm SHA256
          & 7z x "$env:RUNNER_TEMP/firefox.exe" -oC:/RuleProxyFirefox -y
          if ($LASTEXITCODE -ne 0) { throw 'Could not unpack Firefox' }
          'RULEPROXY_TEST_BROWSER=C:/RuleProxyFirefox/core/firefox.exe' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Qualify Firefox rendering and persistent cookies
        if: always() && matrix.runner == 'windows-11-arm' && matrix.architecture == 'arm64'
        run: python -B .github/windows_browser_validation.py --output native-results/firefox
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repair-${{ matrix.runner }}-${{ matrix.architecture }}
          path: native-results/
          if-no-files-found: error
          retention-days: 30
