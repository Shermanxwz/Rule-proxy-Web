name: Windows proxy repair qualification

on:
  push:
    branches: [codex/windows-proxy-repair-*]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-proxy-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Reuse the immutable qualification build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mxc-proxy-runtime-x64
          run-id: 38134137607
          github-token: ${{ github.token }}
          path: qualified-runtime
      - uses: actions/upload-artifact@v7
        with:
          name: mxc-proxy-runtime-x64
          path: qualified-runtime/
          if-no-files-found: error
          retention-days: 30

  native:
    needs: runtime
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: x64
          - runner: windows-11-arm
            architecture: x64
          - runner: windows-11-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - run: python -B install_runtime.py --platform windows-amd64 --if-needed
      - uses: actions/download-artifact@v8
        with:
          name: mxc-proxy-runtime-x64
          path: bin/windows-amd64
      - name: Test upstream proxy transport and the shipped launch path
        run: python -B .github/windows_native_validation.py --output native-results
      - name: Real Edge rendering and cookie persistence
        run: python -B .github/windows_browser_validation.py --output native-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repair-${{ matrix.runner }}-${{ matrix.architecture }}
          path: native-results/
          if-no-files-found: error
          retention-days: 30
