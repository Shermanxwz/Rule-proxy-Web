name: Windows network compartment lab

on:
  push:
    branches:
      - 'claude/windows-compartment-*'
      - 'codex/windows-compartment-finish-*'
    paths:
      - '.github/windows_compartment_lab.py'
      - '.github/windows_restricted_primary_lab.py'
      - '.github/windows_dns_compartment_probe.py'
      - '.github/workflows/windows-compartment-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-compartment-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lab:
    name: Compartment isolation · disposable Server 2025
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64
      - name: Run bounded compartment lab
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B .github/windows_compartment_lab.py driver --out "$PWD\compartment-results"
          if ($LASTEXITCODE -ne 0) { throw 'compartment lab harness failed; inspect report artifact' }
      - name: Probe primary restricted tokens as SYSTEM
        if: always()
        timeout-minutes: 12
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $task = 'RuleProxyRestrictedPrimaryProbe'
          $launch = 'C:\RuleProxyRestrictedPrimaryLaunch'
          $work = 'C:\RuleProxyRestrictedPrimaryLab'
          New-Item -ItemType Directory -Path $launch | Out-Null
          $python = (Get-Command python).Source
          $script = (Resolve-Path .github/windows_restricted_primary_lab.py).Path
          $lab = (Resolve-Path .github/windows_compartment_lab.py).Path
          $probe = (Resolve-Path .github/windows_dns_compartment_probe.py).Path
          $command = '@"' + $python + '" -I -S -B "' + $script + '" --lab-script "' + $lab + '" --probe-script "' + $probe + '" --work "' + $work + '" --variants plain,write_custom_logon,write_custom_rc_logon --browsers edge > "' + $launch + '\stdout.log" 2>&1'
          $wrapper = Join-Path $launch 'run.cmd'
          [IO.File]::WriteAllText($wrapper,$command + "`r`n",[Text.Encoding]::ASCII)
          $action = New-ScheduledTaskAction -Execute "$env:SystemRoot\System32\cmd.exe" -Argument ('/d /c "' + $wrapper + '"')
          $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 10)
          Register-ScheduledTask -TaskName $task -Action $action -Principal $principal -Settings $settings | Out-Null
          try {
            Start-ScheduledTask -TaskName $task
            $deadline = [DateTime]::UtcNow.AddMinutes(10)
            $finished = $false
            do {
              Start-Sleep -Seconds 3
              $path = Join-Path $work 'report.json'
              if (Test-Path -LiteralPath $path) {
                try { $report = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json; $finished = $null -ne $report.finished } catch { }
              }
              $info = Get-ScheduledTaskInfo -TaskName $task
              if ($info.LastRunTime.Year -ge 2026 -and $info.LastTaskResult -ne 267009 -and (Get-ScheduledTask -TaskName $task).State -ne 'Running') { break }
            } while (-not $finished -and [DateTime]::UtcNow -lt $deadline)
            if (-not $finished) { throw 'Restricted-token experiment did not finish; inspect bounded diagnostics' }
            if ($report.error) { throw 'Restricted-token experiment setup failed; inspect report' }
          } finally {
            Stop-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue
            Unregister-ScheduledTask -TaskName $task -Confirm:$false
            New-Item -ItemType Directory -Path compartment-results/restricted-primary -Force | Out-Null
            if (Test-Path -LiteralPath (Join-Path $work 'report.json')) { Copy-Item -LiteralPath (Join-Path $work 'report.json') -Destination compartment-results/restricted-primary/report.json }
            if (Test-Path -LiteralPath (Join-Path $launch 'stdout.log')) { Get-Content -LiteralPath (Join-Path $launch 'stdout.log') -Tail 100 | Set-Content compartment-results/restricted-primary/stdout.log }
          }
      - name: Collect bounded native logs
        if: always()
        shell: pwsh
        run: |
          $source = 'C:\RuleProxyCompartmentLab'
          $target = "$PWD\compartment-results\logs"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          if (Test-Path $source) {
            Get-ChildItem -Path $source -File -Include *.log,*.json -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Length -le 2MB } |
              ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $target $_.Name) -Force }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compartment-results
          path: compartment-results/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  publish:
    name: Publish lab report to the results branch
    needs: [lab]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: compartment-results
          path: results
        continue-on-error: true
      - name: Commit the report to a dedicated results branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULTS_BRANCH: claude/windows-compartment-results
        run: |
          set -euo pipefail
          if [ ! -d results ] || [ -z "$(ls -A results)" ]; then echo 'no results'; exit 0; fi
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          run_dir="runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in 1 2 3 4 5; do
            rm -rf tree
            if git ls-remote --exit-code --heads "$remote" "$RESULTS_BRANCH" >/dev/null 2>&1; then
              git clone -q --depth 1 --branch "$RESULTS_BRANCH" "$remote" tree
            else
              git init -q -b "$RESULTS_BRANCH" tree
              git -C tree remote add origin "$remote"
            fi
            mkdir -p "tree/$run_dir"
            cp -r results/. "tree/$run_dir/"
            printf '%s\n' "${GITHUB_SHA}" > "tree/$run_dir/source-commit.txt"
            git -C tree add -A
            git -C tree -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "Compartment lab report ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} for ${GITHUB_SHA}"
            if git -C tree push -q origin "HEAD:refs/heads/$RESULTS_BRANCH"; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
