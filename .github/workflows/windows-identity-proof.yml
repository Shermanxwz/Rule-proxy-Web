name: Windows identity proof compile only

on:
  push:
    branches: ['dot/windows-isolation-proof']
    paths:
      - '.github/native/windows_identity_actor.cpp'
      - '.github/build_windows_identity_actor.ps1'
      - '.github/windows_identity_proof.py'
      - '.github/windows_identity_pipe_probe.py'
      - 'tests/test_windows_identity*.py'
      - '.github/workflows/windows-identity-proof.yml'

permissions:
  contents: read

concurrency:
  group: identity-proof-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-proof-compile:
    name: Compile native identity proof only
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Load installed MSVC and compile without executing the actor
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Installed MSVC toolchain not found' }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          ./.github/build_windows_identity_actor.ps1 -OutputDirectory "$PWD\identity-actor-build"
      - name: Pure Python identity proof unit tests only
        run: python -B -m unittest discover -s tests -p "test_windows_identity*.py" -v
      - uses: actions/upload-artifact@v7
        with:
          name: identity-actor-compile-only
          path: |
            identity-actor-build/windows_identity_actor.exe
            identity-actor-build/build-manifest.json
          if-no-files-found: error
          retention-days: 7

